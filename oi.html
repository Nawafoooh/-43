<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Crypto Derivatives Intelligence Terminal — Audit Version</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root {
  --bg-0: #06080e;
  --bg-1: #0b0f19;
  --bg-2: #111726;
  --bg-2-hover: #161f33;
  --border: #1c2638;
  --border-soft: #141c2b;
  --text-1: #e6eefa;
  --text-2: #8a98ad;
  --text-3: #515e73;
  --up: #10b981;
  --up-dim: rgba(16, 185, 129, 0.15);
  --down: #f43f5e;
  --down-dim: rgba(244, 63, 94, 0.15);
  --blue: #3b82f6;
  --blue-dim: rgba(59, 130, 246, 0.15);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245, 158, 11, 0.15);
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 4px 20px -2px rgba(0,0,0,0.5);
  --sans: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --header-h: 60px;
}

[data-theme="light"] {
  --bg-0: #f1f5f9;
  --bg-1: #ffffff;
  --bg-2: #f8fafc;
  --bg-2-hover: #e2e8f0;
  --border: #cbd5e1;
  --border-soft: #e2e8f0;
  --text-1: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-0); color: var(--text-1); font-family: var(--sans); direction: rtl; min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { font-family: inherit; }

#app { display: flex; flex-direction: column; min-height: 100vh; }

/* Global Header */
header.top-bar {
  height: var(--header-h); background: var(--bg-1); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  position: sticky; top: 0; z-index: 100;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--blue), #1d4ed8);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #fff; box-shadow: 0 0 12px rgba(59,130,246,0.4);
}
.brand-title h1 { font-size: 15px; font-weight: 800; }
.brand-title p { font-size: 11px; color: var(--text-2); }

.global-metrics { display: flex; align-items: center; gap: 16px; font-size: 12px; }
.gm-item { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--border-soft); padding-left: 16px; }
.gm-item:last-child { border-left: none; }
.gm-label { color: var(--text-3); font-size: 10px; font-weight: 700; text-transform: uppercase; }
.gm-val { font-weight: 700; font-family: var(--mono); color: var(--text-1); }

/* Control Toolbar */
.control-bar {
  background: var(--bg-1); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  position: sticky; top: var(--header-h); z-index: 90;
}
.search-box { position: relative; flex: 1 1 200px; max-width: 260px; }
.search-box i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 12px; }
.search-box input {
  width: 100%; height: 34px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0 32px 0 10px; color: var(--text-1); font-size: 12px; outline: none;
}
.search-box input:focus { border-color: var(--blue); }

.seg-group { display: flex; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; gap: 2px; overflow-x: auto; }
.seg-btn {
  background: transparent; border: none; color: var(--text-2); font-size: 11px; font-weight: 700;
  padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.seg-btn.active { background: var(--blue); color: #fff; }
.seg-btn:hover:not(.active) { color: var(--text-1); background: var(--bg-2-hover); }

select.ctrl-select {
  height: 34px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-1);
  border-radius: var(--radius-sm); padding: 0 10px; font-size: 12px; font-weight: 700; outline: none; cursor: pointer;
}
select.ctrl-select.tf-select { border-color: var(--blue); color: var(--blue); }

.btn-icon {
  width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s;
}
.btn-icon:hover { color: var(--text-1); border-color: var(--text-3); background: var(--bg-2-hover); }

/* Grid Layout */
main.content { padding: 20px; flex: 1; }
#grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 18px; }
#grid.density-compact { grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 12px; }
#grid.density-large { grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 24px; }

/* Dashboard Card */
.card {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
  position: relative; transition: border-color 0.2s;
}
.card:hover { border-color: var(--text-3); }

/* Card Header */
.card-head {
  padding: 10px 14px; background: var(--bg-1); border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: space-between;
}
.symbol-block { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.status-dot.live { background: var(--up); box-shadow: 0 0 8px var(--up); }
.status-dot.stale { background: var(--yellow); box-shadow: 0 0 8px var(--yellow); }
.status-dot.loading { background: var(--blue); animation: pulse 1s infinite alternate; }
@keyframes pulse { from { opacity: 0.3; } to { opacity: 1; } }

.symbol-title { font-size: 14px; font-weight: 800; font-family: var(--mono); }
.symbol-meta { font-size: 11px; color: var(--text-2); }
.action-btn { background: transparent; border: none; color: var(--text-3); font-size: 13px; cursor: pointer; padding: 4px; }
.action-btn.pinned { color: var(--yellow); }

/* Price Container */
.price-chart-wrap { height: 160px; position: relative; background: var(--bg-0); border-bottom: 1px solid var(--border-soft); }
.density-compact .price-chart-wrap { height: 120px; }
.density-large .price-chart-wrap { height: 240px; }

.chart-placeholder {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--text-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
}

/* Data Body */
.card-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.data-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.metric-box {
  background: var(--bg-1); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
  padding: 8px; display: flex; flex-direction: column; gap: 3px;
}
.metric-title { font-size: 10px; font-weight: 800; color: var(--text-3); text-transform: uppercase; display: flex; justify-content: space-between; }
.metric-val { font-size: 14px; font-weight: 800; font-family: var(--mono); color: var(--text-1); }
.metric-sub { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.up { color: var(--up); }
.down { color: var(--down); }
.neutral { color: var(--text-2); }

.sparkline-container { height: 22px; width: 100%; margin-top: 2px; }
.sparkline-container svg { width: 100%; height: 100%; overflow: visible; }

/* Multi Timeframe Table */
.mtf-table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: var(--mono); background: var(--bg-1); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-soft); }
.mtf-table th { background: var(--bg-0); color: var(--text-3); font-size: 9px; text-transform: uppercase; padding: 4px 6px; text-align: center; }
.mtf-table td { padding: 5px 6px; text-align: center; border-top: 1px solid var(--border-soft); }

/* Top Traders Ratio Bar */
.whale-ratio-wrap {
  display: flex; flex-direction: column; gap: 3px; background: var(--bg-1);
  padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft);
}
.whale-labels { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; font-family: var(--mono); }
.whale-bar-track { height: 6px; background: var(--down); border-radius: 3px; overflow: hidden; display: flex; }
.whale-bar-fill { height: 100%; background: var(--up); transition: width 0.3s ease; }

/* Analytics Breakdown Container */
.analysis-box {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px; display: flex; flex-direction: column; gap: 8px;
}
.state-row { display: flex; justify-content: space-between; align-items: center; }
.state-badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; text-transform: uppercase; font-family: var(--mono); }

.badge-long-bu { background: var(--up-dim); color: var(--up); border: 1px solid var(--up); }
.badge-short-bu { background: var(--down-dim); color: var(--down); border: 1px solid var(--down); }
.badge-short-cov { background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue); }
.badge-long-uw { background: var(--yellow-dim); color: var(--yellow); border: 1px solid var(--yellow); }

.setup-title { font-size: 11px; font-weight: 700; color: var(--text-2); }
.confidence-val { font-size: 12px; font-weight: 800; font-family: var(--mono); color: var(--blue); }

/* Accordion WHY Section */
details.why-accordion {
  background: var(--bg-0); border: 1px solid var(--border-soft); border-radius: 6px; overflow: hidden; font-size: 11px;
}
details.why-accordion summary {
  padding: 6px 10px; cursor: pointer; font-weight: 700; color: var(--text-2); user-select: none;
  display: flex; justify-content: space-between; align-items: center; background: var(--bg-1);
}
details.why-accordion summary:hover { color: var(--text-1); }
.why-content { padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border-soft); }
.why-list { list-style: none; display: flex; flex-direction: column; gap: 3px; color: var(--text-2); }
.why-list li::before { content: "• "; color: var(--blue); font-weight: bold; }

.score-breakdown-table { width: 100%; margin-top: 4px; font-family: var(--mono); font-size: 10px; border-collapse: collapse; }
.score-breakdown-table td { padding: 2px 0; border-bottom: 1px dashed var(--border-soft); }
.score-breakdown-table td:last-child { text-align: left; font-weight: bold; }
.na-tag { color: var(--text-3); font-style: italic; }

.card-foot {
  padding: 6px 12px; background: var(--bg-1); border-top: 1px solid var(--border-soft);
  font-size: 10px; color: var(--text-3); display: flex; justify-content: space-between; align-items: center;
}
.freshness-badge { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; }

@media (max-width: 600px) {
  .global-metrics { display: none; }
  #grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="app">
  <!-- Header -->
  <header class="top-bar">
    <div class="brand">
      <div class="brand-icon">OI</div>
      <div class="brand-title">
        <h1>Crypto Derivatives Terminal</h1>
        <p>Audit Engine — Fact-Based Derivatives Analytics</p>
      </div>
    </div>

    <div class="global-metrics">
      <div class="gm-item">
        <span class="gm-label">Markets</span>
        <span class="gm-val" id="gm-total">0</span>
      </div>
      <div class="gm-item">
        <span class="gm-label">TRACKED MARKET OI</span>
        <span class="gm-val" id="gm-oi">$--</span>
      </div>
      <div class="gm-item">
        <span class="gm-label">OI Up / Down</span>
        <span class="gm-val" id="gm-updown">-- / --</span>
      </div>
      <div class="gm-item">
        <span class="gm-label">Avg Funding</span>
        <span class="gm-val" id="gm-funding">--%</span>
      </div>
    </div>

    <div style="display:flex; gap:8px;">
      <button class="btn-icon" id="btn-theme" title="تغيير المظهر"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>

  <!-- Control Bar -->
  <div class="control-bar">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="بحث من بين العملات المتابعة...">
    </div>

    <!-- Primary Analysis Timeframe -->
    <select class="ctrl-select tf-select" id="timeframe-select" title="اختر الفريم الزمني الرئيسي للتحليل">
      <option value="15m">فريم 15 دقيقة (15m)</option>
      <option value="1h">فريم 1 ساعة (1H)</option>
      <option value="4h" selected>فريم 4 ساعات (4H)</option>
      <option value="1d">فريم يومي (1D)</option>
    </select>

    <div class="seg-group" id="filter-seg">
      <button class="seg-btn active" data-filter="all">الكل</button>
      <button class="seg-btn" data-filter="pinned">المثبتة</button>
      <button class="seg-btn" data-filter="long-bu">Long Build-up</button>
      <button class="seg-btn" data-filter="short-bu">Short Build-up</button>
      <button class="seg-btn" data-filter="short-cov">Short Covering</button>
      <button class="seg-btn" data-filter="long-uw">Long Unwind</button>
      <button class="seg-btn" data-filter="high-confidence">High Confidence (75+)</button>
    </div>

    <select class="ctrl-select" id="sort-select">
      <option value="priority">الترتيب الافتراضي</option>
      <option value="oi-change">تغير الـ OI</option>
      <option value="confidence">نسبة الثقة (Confidence)</option>
      <option value="funding">معدل التمويل (Funding)</option>
      <option value="alpha">أبجدي</option>
    </select>

    <div class="seg-group" id="density-seg">
      <button class="seg-btn" data-density="compact"><i class="fa-solid fa-list"></i></button>
      <button class="seg-btn active" data-density="normal"><i class="fa-solid fa-border-all"></i></button>
      <button class="seg-btn" data-density="large"><i class="fa-solid fa-square"></i></button>
    </div>

    <button class="btn-icon" id="btn-refresh" title="تحديث البيانات"><i class="fa-solid fa-rotate"></i></button>
  </div>

  <!-- Cards Grid -->
  <main class="content">
    <div id="grid"></div>
  </main>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
const SYMBOLS_CONFIG = [
  { id: "btc", symbol: "BTCUSDT", name: "Bitcoin", tvSymbol: "BINANCE:BTCUSDT.P", priority: 1 },
  { id: "eth", symbol: "ETHUSDT", name: "Ethereum", tvSymbol: "BINANCE:ETHUSDT.P", priority: 2 },
  { id: "sol", symbol: "SOLUSDT", name: "Solana", tvSymbol: "BINANCE:SOLUSDT.P", priority: 3 },
  { id: "bnb", symbol: "BNBUSDT", name: "BNB", tvSymbol: "BINANCE:BNBUSDT.P", priority: 4 },
  { id: "xrp", symbol: "XRPUSDT", name: "XRP", tvSymbol: "BINANCE:XRPUSDT.P", priority: 5 },
  { id: "doge", symbol: "DOGEUSDT", name: "Dogecoin", tvSymbol: "BINANCE:DOGEUSDT.P", priority: 6 },
  { id: "ada", symbol: "ADAUSDT", name: "Cardano", tvSymbol: "BINANCE:ADAUSDT.P", priority: 7 },
  { id: "avax", symbol: "AVAXUSDT", name: "Avalanche", tvSymbol: "BINANCE:AVAXUSDT.P", priority: 8 },
  { id: "sui", symbol: "SUIUSDT", name: "Sui", tvSymbol: "BINANCE:SUIUSDT.P", priority: 9 },
  { id: "link", symbol: "LINKUSDT", name: "Chainlink", tvSymbol: "BINANCE:LINKUSDT.P", priority: 10 }
];

function formatUSD(num) {
  if (num >= 1e9) return '$' + (num / 1e9).toFixed(2) + 'B';
  if (num >= 1e6) return '$' + (num / 1e6).toFixed(2) + 'M';
  if (num >= 1e3) return '$' + (num / 1e3).toFixed(2) + 'K';
  return '$' + num.toFixed(2);
}

function renderOIMiniChart(dataSeries) {
  if (!dataSeries || dataSeries.length < 2) return '';
  const min = Math.min(...dataSeries);
  const max = Math.max(...dataSeries);
  const range = (max - min) || 1;
  const points = dataSeries.map((val, i) => {
    const x = (i / (dataSeries.length - 1)) * 100;
    const y = 20 - ((val - min) / range) * 20;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const isUp = dataSeries[dataSeries.length - 1] >= dataSeries[0];
  return `<svg viewBox="0 0 100 20"><polyline fill="none" stroke="${isUp ? '#10b981' : '#f43f5e'}" stroke-width="2" points="${points}" /></svg>`;
}

class DashboardManager {
  constructor() {
    this.symbols = SYMBOLS_CONFIG;
    this.pinned = new Set(JSON.parse(localStorage.getItem('oi_pinned') || '[]'));
    this.grid = document.getElementById('grid');
    this.tvWidgets = new Map();
    this.metricsData = new Map();

    this.currentFilter = 'all';
    this.currentSort = 'priority';
    this.searchTerm = '';
    this.currentTimeframe = '4h';

    this.initIntersectionObserver();
    this.initUI();
    this.renderCardsSkeleton();
    this.startDataLoop();
  }

  initIntersectionObserver() {
    this.observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const cardId = entry.target.id.replace('card-', '');
          const cfg = this.symbols.find(s => s.id === cardId);
          if (cfg && !this.tvWidgets.has(cfg.id)) {
            this.initTradingViewWidget(cfg);
          }
        }
      });
    }, { rootMargin: "100px" });
  }

  initUI() {
    document.getElementById('btn-theme').addEventListener('click', () => {
      const theme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', theme);
    });

    document.getElementById('btn-refresh').addEventListener('click', () => this.fetchDataAll());

    document.getElementById('timeframe-select').addEventListener('change', (e) => {
      this.currentTimeframe = e.target.value;
      this.updateTVWidgetsTimeframe(this.currentTimeframe);
      this.fetchDataAll();
    });

    document.getElementById('filter-seg').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        document.querySelectorAll('#filter-seg .seg-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        this.currentFilter = e.target.dataset.filter;
        this.applyFilterAndSort();
      }
    });

    document.getElementById('sort-select').addEventListener('change', (e) => {
      this.currentSort = e.target.value;
      this.applyFilterAndSort();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      this.searchTerm = e.target.value.toLowerCase().trim();
      this.applyFilterAndSort();
    });
  }

  renderCardsSkeleton() {
    this.grid.innerHTML = '';
    this.symbols.forEach(cfg => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${cfg.id}`;
      card.innerHTML = `
        <div class="card-head">
          <div class="symbol-block">
            <div class="status-dot loading" id="status-${cfg.id}"></div>
            <div>
              <span class="symbol-title">${cfg.name}</span>
              <span class="symbol-meta">${cfg.symbol}</span>
            </div>
          </div>
          <button class="action-btn ${this.pinned.has(cfg.id) ? 'pinned' : ''}" onclick="dashboard.togglePin('${cfg.id}')">
            <i class="fa-solid fa-thumbtack"></i>
          </button>
        </div>

        <div class="price-chart-wrap" id="tv-wrap-${cfg.id}">
          <div class="chart-placeholder">جاري تحميل الشارت المباشر...</div>
        </div>

        <div class="card-body">
          <div class="data-row">
            <div class="metric-box">
              <div class="metric-title">Open Interest (${this.currentTimeframe}) <span id="oi-spark-${cfg.id}"></span></div>
              <div class="metric-val" id="oi-val-${cfg.id}">$--</div>
              <div class="metric-sub" id="oi-sub-${cfg.id}">--%</div>
            </div>
            <div class="metric-box">
              <div class="metric-title">Funding Rate</div>
              <div class="metric-val" id="funding-val-${cfg.id}">--%</div>
              <div class="metric-sub" id="price-sub-${cfg.id}">Price: $--</div>
            </div>
          </div>

          <!-- Multi Timeframe OI Matrix -->
          <table class="mtf-table">
            <thead>
              <tr>
                <th>15M</th>
                <th>1H</th>
                <th>4H</th>
                <th>24H</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td id="oi-15m-${cfg.id}">--</td>
                <td id="oi-1h-${cfg.id}">--</td>
                <td id="oi-4h-${cfg.id}">--</td>
                <td id="oi-24h-${cfg.id}">--</td>
              </tr>
            </tbody>
          </table>

          <!-- Top Traders Account Ratio (Real Binance Data) -->
          <div class="whale-ratio-wrap">
            <div class="whale-labels">
              <span>Top Trader Accounts (Long): <b id="whale-long-${cfg.id}">--%</b></span>
              <span>(Short): <b id="whale-short-${cfg.id}">--%</b></span>
            </div>
            <div class="whale-bar-track">
              <div class="whale-bar-fill" id="whale-bar-${cfg.id}" style="width: 50%;"></div>
            </div>
          </div>

          <!-- Rigorous Analytics Box -->
          <div class="analysis-box">
            <div class="state-row">
              <span class="state-badge" id="state-badge-${cfg.id}">--</span>
              <span class="confidence-val" id="conf-val-${cfg.id}">Confidence: --/100</span>
            </div>
            <div class="setup-title" id="setup-title-${cfg.id}">Setup: Analyzing Market Alignment...</div>

            <!-- Expandable WHY Section -->
            <details class="why-accordion">
              <summary>
                <span>لماذا هذه الحالة؟ (WHY THIS STATE?)</span>
                <i class="fa-solid fa-chevron-down"></i>
              </summary>
              <div class="why-content">
                <ul class="why-list" id="why-list-${cfg.id}"></ul>
                
                <table class="score-breakdown-table">
                  <thead>
                    <tr style="color:var(--text-3); font-size:9px;">
                      <th>العامل (FACTOR)</th>
                      <th style="text-align:left;">النقاط (POINTS)</th>
                    </tr>
                  </thead>
                  <tbody id="score-breakdown-${cfg.id}"></tbody>
                </table>
              </div>
            </details>
          </div>
        </div>

        <div class="card-foot">
          <span class="freshness-badge" id="freshness-${cfg.id}">● FETCHING...</span>
          <span>Binance Futures API</span>
        </div>
      `;
      this.grid.appendChild(card);
      this.observer.observe(card);
    });
  }

  getTVInterval(tf) {
    if (tf === '15m') return '15';
    if (tf === '1h') return '60';
    if (tf === '4h') return '240';
    if (tf === '1d') return 'D';
    return '240';
  }

  initTradingViewWidget(cfg) {
    const wrap = document.getElementById(`tv-wrap-${cfg.id}`);
    wrap.innerHTML = '';
    const widget = new TradingView.widget({
      autosize: true,
      symbol: cfg.tvSymbol,
      interval: this.getTVInterval(this.currentTimeframe),
      timezone: "Etc/UTC",
      theme: "dark",
      style: "1",
      locale: "ar",
      enable_publishing: false,
      hide_top_toolbar: true,
      hide_legend: true,
      save_image: false,
      container_id: `tv-wrap-${cfg.id}`
    });
    this.tvWidgets.set(cfg.id, widget);
  }

  updateTVWidgetsTimeframe(tf) {
    this.tvWidgets.forEach((widget, id) => {
      const cfg = this.symbols.find(s => s.id === id);
      if (cfg) this.initTradingViewWidget(cfg);
    });
  }

  async fetchDataAll() {
    try {
      const [tickersRes, fundingsRes] = await Promise.all([
        fetch('https://fapi.binance.com/fapi/v1/ticker/24hr'),
        fetch('https://fapi.binance.com/fapi/v1/premiumIndex')
      ]);

      const tickers = await tickersRes.json();
      const fundings = await fundingsRes.json();

      const tickerMap = new Map(tickers.map(t => [t.symbol, t]));
      const fundingMap = new Map(fundings.map(f => [f.symbol, f]));

      for (const cfg of this.symbols) {
        const ticker = tickerMap.get(cfg.symbol);
        const funding = fundingMap.get(cfg.symbol);

        if (ticker && funding) {
          this.fetchComprehensiveDerivativesData(cfg, ticker, funding);
        }
      }
    } catch (err) {
      console.error("Batch fetch error:", err);
    }
  }

  async fetchComprehensiveDerivativesData(cfg, ticker, funding) {
    try {
      const primaryTF = this.currentTimeframe;

      // Fetch Multi-Timeframe OI & Top Traders Data
      const [oiHistPrimary, oi15m, oi1h, oi4h, oi24h, topTraderAccs] = await Promise.all([
        fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${cfg.symbol}&period=${primaryTF}&limit=30`).then(r => r.json()),
        fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${cfg.symbol}&period=15m&limit=2`).then(r => r.json()),
        fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${cfg.symbol}&period=1h&limit=2`).then(r => r.json()),
        fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${cfg.symbol}&period=4h&limit=2`).then(r => r.json()),
        fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${cfg.symbol}&period=1d&limit=2`).then(r => r.json()),
        fetch(`https://fapi.binance.com/futures/data/topLongShortAccountRatio?symbol=${cfg.symbol}&period=4h&limit=1`).then(r => r.json())
      ]);

      if (!oiHistPrimary || oiHistPrimary.length < 2) return;

      const price = parseFloat(ticker.lastPrice);
      const priceChange = parseFloat(ticker.priceChangePercent);
      const fundingRate = parseFloat(funding.lastFundingRate) * 100;

      // Helper for OI Change calculation
      const calcOIChange = (hist) => {
        if (!hist || hist.length < 2) return 0;
        const cur = parseFloat(hist[hist.length - 1].sumOpenInterestValue);
        const prev = parseFloat(hist[0].sumOpenInterestValue);
        return ((cur - prev) / prev) * 100;
      };

      const oiChange15m = calcOIChange(oi15m);
      const oiChange1h = calcOIChange(oi1h);
      const oiChange4h = calcOIChange(oi4h);
      const oiChange24h = calcOIChange(oi24h);

      const latestOIVal = parseFloat(oiHistPrimary[oiHistPrimary.length - 1].sumOpenInterestValue);
      const oiChangePrimary = calcOIChange(oiHistPrimary);

      // OI Momentum & Acceleration (Delta of Delta)
      const series = oiHistPrimary.map(d => parseFloat(d.sumOpenInterestValue));
      const deltaRecent = series[series.length - 1] - series[series.length - 2];
      const deltaPrevious = series[series.length - 2] - series[series.length - 3] || 1;
      const oiMomentum = ((deltaRecent - deltaPrevious) / Math.abs(deltaPrevious)) * 100;
      const isAccelerating = deltaRecent > deltaPrevious && deltaRecent > 0;

      // Top Traders Account Data
      let topLongRatio = null;
      let topShortRatio = null;
      if (topTraderAccs && topTraderAccs.length > 0) {
        topLongRatio = parseFloat(topTraderAccs[0].longAccount) * 100;
        topShortRatio = parseFloat(topTraderAccs[0].shortAccount) * 100;
      }

      // 1. DETERMINE MARKET STATE (Purely Objective Data Rules)
      let marketState = "NEUTRAL";
      if (priceChange >= 0 && oiChangePrimary > 0) marketState = "LONG BUILD-UP";
      else if (priceChange < 0 && oiChangePrimary > 0) marketState = "SHORT BUILD-UP";
      else if (priceChange >= 0 && oiChangePrimary <= 0) marketState = "SHORT COVERING";
      else if (priceChange < 0 && oiChangePrimary <= 0) marketState = "LONG UNWIND";

      // 2. TRADE SETUP HYPOTHESIS
      let tradeSetup = "Range / Consolidation";
      if (marketState === "LONG BUILD-UP") {
        tradeSetup = isAccelerating ? "Breakout Trend Continuation" : "Gradual Accumulation";
      } else if (marketState === "SHORT BUILD-UP") {
        tradeSetup = isAccelerating ? "Aggressive Downward Expansion" : "Hedging / Resistance Pressure";
      } else if (marketState === "SHORT COVERING") {
        tradeSetup = "Squeeze / Short Liquidation Rally";
      } else if (marketState === "LONG UNWIND") {
        tradeSetup = "Long Liquidation / Deleveraging";
      }

      // 3. EXPLAINABLE CONFIDENCE SCORE ENGINE (Normalized Across Available Data Only)
      let availableWeight = 0;
      let earnedPoints = 0;

      const breakdown = [];

      // Factor 1: OI Momentum (Max 25)
      const oiMomPoints = Math.min(25, Math.max(0, Math.round((Math.abs(oiChangePrimary) / 3) * 25)));
      earnedPoints += oiMomPoints;
      availableWeight += 25;
      breakdown.push({ factor: "OI Momentum", score: `${oiMomPoints}/25` });

      // Factor 2: Price/OI Relation Divergence (Max 25)
      let relationPoints = 15;
      if (marketState === "LONG BUILD-UP" || marketState === "SHORT BUILD-UP") relationPoints = 25; // Trend Expansion
      else if (marketState === "SHORT COVERING" || marketState === "LONG UNWIND") relationPoints = 10; // Deleveraging
      earnedPoints += relationPoints;
      availableWeight += 25;
      breakdown.push({ factor: "Price/OI Divergence Alignment", score: `${relationPoints}/25` });

      // Factor 3: Funding Rate Crowdedness (Max 25)
      let fundingPoints = 20;
      if (Math.abs(fundingRate) > 0.05) fundingPoints = 8; // Crowded Trade Danger
      earnedPoints += fundingPoints;
      availableWeight += 25;
      breakdown.push({ factor: "Funding Rate Balance", score: `${fundingPoints}/25` });

      // Factor 4: Top Traders Positioning (Max 25 - Only if available)
      if (topLongRatio !== null) {
        let traderPoints = 12;
        if ((marketState === "LONG BUILD-UP" && topLongRatio > 55) || (marketState === "SHORT BUILD-UP" && topShortRatio > 55)) {
          traderPoints = 25;
        }
        earnedPoints += traderPoints;
        availableWeight += 25;
        breakdown.push({ factor: "Top Traders Account Alignment", score: `${traderPoints}/25` });
      } else {
        breakdown.push({ factor: "Top Traders Account Alignment", score: `<span class="na-tag">N/A</span>` });
      }

      // Unavailable Data Factors explicitly marked N/A
      breakdown.push({ factor: "Liquidations Data", score: `<span class="na-tag">N/A</span>` });
      breakdown.push({ factor: "Orderbook Cumulative Volume Delta (CVD)", score: `<span class="na-tag">N/A</span>` });
      breakdown.push({ factor: "Taker Buy/Sell Volume Flow", score: `<span class="na-tag">N/A</span>` });

      // Normalize Score to 100
      const confidenceScore = Math.min(100, Math.round((earnedPoints / availableWeight) * 100));

      // 4. WHY LIST GENERATION
      const whyList = [];
      whyList.push(`Price: ${priceChange >= 0 ? '+' : ''}${priceChange.toFixed(2)}% | OI (${primaryTF}): ${oiChangePrimary >= 0 ? '+' : ''}${oiChangePrimary.toFixed(2)}%`);
      whyList.push(`Funding: ${fundingRate >= 0 ? '+' : ''}${fundingRate.toFixed(4)}% (${Math.abs(fundingRate) > 0.03 ? 'Crowded' : 'Normal'})`);
      whyList.push(isAccelerating ? `OI Momentum: Accelerating (+${oiMomentum.toFixed(1)}%)` : `OI Momentum: Decelerating`);
      if (topLongRatio !== null) {
        whyList.push(`Top Trader Accounts: ${topLongRatio.toFixed(1)}% Long / ${topShortRatio.toFixed(1)}% Short`);
      }

      const data = {
        price, priceChange, oiValUSD: latestOIVal, oiChangePrimary,
        fundingRate, marketState, tradeSetup, confidenceScore,
        oiChange15m, oiChange1h, oiChange4h, oiChange24h,
        topLongRatio, topShortRatio,
        historySeries: series, whyList, breakdown,
        fetchTime: new Date()
      };

      this.metricsData.set(cfg.id, data);
      this.updateCardDOM(cfg.id, data);
    } catch (e) {
      console.error(`Error processing ${cfg.symbol}:`, e);
      document.getElementById(`status-${cfg.id}`).className = "status-dot stale";
    }
  }

  updateCardDOM(id, data) {
    const statusDot = document.getElementById(`status-${id}`);
    statusDot.className = "status-dot live";

    document.getElementById(`oi-val-${id}`).textContent = formatUSD(data.oiValUSD);

    const oiSub = document.getElementById(`oi-sub-${id}`);
    const isUp = data.oiChangePrimary >= 0;
    oiSub.textContent = `${isUp ? '▲' : '▼'} ${data.oiChangePrimary.toFixed(2)}%`;
    oiSub.className = `metric-sub ${isUp ? 'up' : 'down'}`;

    document.getElementById(`oi-spark-${id}`).innerHTML = renderOIMiniChart(data.historySeries);

    const fundingEl = document.getElementById(`funding-val-${id}`);
    fundingEl.textContent = (data.fundingRate >= 0 ? '+' : '') + data.fundingRate.toFixed(4) + '%';
    fundingEl.className = `metric-val ${data.fundingRate > 0 ? 'up' : data.fundingRate < 0 ? 'down' : 'neutral'}`;

    document.getElementById(`price-sub-${id}`).textContent = `Price: $${data.price.toFixed(2)} (${data.priceChange >= 0 ? '+' : ''}${data.priceChange.toFixed(2)}%)`;

    // Multi Timeframe Table DOM
    const setMTFCell = (elemId, val) => {
      const el = document.getElementById(elemId);
      el.textContent = (val >= 0 ? '+' : '') + val.toFixed(2) + '%';
      el.className = val >= 0 ? 'up' : 'down';
    };
    setMTFCell(`oi-15m-${id}`, data.oiChange15m);
    setMTFCell(`oi-1h-${id}`, data.oiChange1h);
    setMTFCell(`oi-4h-${id}`, data.oiChange4h);
    setMTFCell(`oi-24h-${id}`, data.oiChange24h);

    // Top Traders Ratio Bar DOM
    if (data.topLongRatio !== null) {
      document.getElementById(`whale-long-${id}`).textContent = `${data.topLongRatio.toFixed(1)}%`;
      document.getElementById(`whale-short-${id}`).textContent = `${data.topShortRatio.toFixed(1)}%`;
      document.getElementById(`whale-bar-${id}`).style.width = `${data.topLongRatio}%`;
    }

    // Market State & Confidence DOM
    const badgeEl = document.getElementById(`state-badge-${id}`);
    badgeEl.textContent = data.marketState;
    badgeEl.className = "state-badge " + (
      data.marketState === 'LONG BUILD-UP' ? 'badge-long-bu' :
      data.marketState === 'SHORT BUILD-UP' ? 'badge-short-bu' :
      data.marketState === 'SHORT COVERING' ? 'badge-short-cov' : 'badge-long-uw'
    );

    document.getElementById(`conf-val-${id}`).textContent = `Confidence: ${data.confidenceScore}/100`;
    document.getElementById(`setup-title-${id}`).textContent = `Setup: ${data.tradeSetup}`;

    // Accordion WHY Section DOM
    const whyListEl = document.getElementById(`why-list-${id}`);
    whyListEl.innerHTML = data.whyList.map(item => `<li>${item}</li>`).join('');

    const breakdownTbody = document.getElementById(`score-breakdown-${id}`);
    breakdownTbody.innerHTML = data.breakdown.map(b => `
      <tr>
        <td style="color:var(--text-2);">${b.factor}</td>
        <td>${b.score}</td>
      </tr>
    `).join('');

    // Freshness Counter
    const freshEl = document.getElementById(`freshness-${id}`);
    freshEl.innerHTML = `<span style="color:var(--up);">● LIVE</span> Updated just now`;
  }

  updateGlobalMetrics() {
    let totalOI = 0, upCount = 0, downCount = 0, totalFunding = 0, count = 0;
    this.metricsData.forEach(d => {
      totalOI += d.oiValUSD;
      if (d.oiChangePrimary > 0) upCount++; else downCount++;
      totalFunding += d.fundingRate;
      count++;
    });

    if (count > 0) {
      document.getElementById('gm-total').textContent = `${count} / ${this.symbols.length}`;
      document.getElementById('gm-oi').textContent = formatUSD(totalOI);
      document.getElementById('gm-updown').textContent = `${upCount} ↑ / ${downCount} ↓`;
      document.getElementById('gm-funding').textContent = (totalFunding / count).toFixed(4) + '%';
    }
  }

  startDataLoop() {
    this.fetchDataAll();
    setInterval(() => this.fetchDataAll(), 20000);
  }

  togglePin(id) {
    if (this.pinned.has(id)) this.pinned.delete(id);
    else this.pinned.add(id);
    localStorage.setItem('oi_pinned', JSON.stringify([...this.pinned]));
    document.querySelector(`#card-${id} .action-btn`).classList.toggle('pinned');
    this.applyFilterAndSort();
  }

  applyFilterAndSort() {
    let visible = [...this.symbols];

    if (this.searchTerm) {
      visible = visible.filter(s => s.name.toLowerCase().includes(this.searchTerm) || s.symbol.toLowerCase().includes(this.searchTerm));
    }
    if (this.currentFilter === 'pinned') {
      visible = visible.filter(s => this.pinned.has(s.id));
    } else if (this.currentFilter === 'long-bu') {
      visible = visible.filter(s => this.metricsData.get(s.id)?.marketState === 'LONG BUILD-UP');
    } else if (this.currentFilter === 'short-bu') {
      visible = visible.filter(s => this.metricsData.get(s.id)?.marketState === 'SHORT BUILD-UP');
    } else if (this.currentFilter === 'short-cov') {
      visible = visible.filter(s => this.metricsData.get(s.id)?.marketState === 'SHORT COVERING');
    } else if (this.currentFilter === 'long-uw') {
      visible = visible.filter(s => this.metricsData.get(s.id)?.marketState === 'LONG UNWIND');
    } else if (this.currentFilter === 'high-confidence') {
      visible = visible.filter(s => (this.metricsData.get(s.id)?.confidenceScore || 0) >= 75);
    }

    visible.sort((a, b) => {
      const mA = this.metricsData.get(a.id);
      const mB = this.metricsData.get(b.id);
      if (this.currentSort === 'confidence') return (mB?.confidenceScore || 0) - (mA?.confidenceScore || 0);
      if (this.currentSort === 'oi-change') return (mB?.oiChangePrimary || 0) - (mA?.oiChangePrimary || 0);
      if (this.currentSort === 'funding') return (mB?.fundingRate || 0) - (mA?.fundingRate || 0);
      return a.priority - b.priority;
    });

    visible.forEach(cfg => {
      const el = document.getElementById(`card-${cfg.id}`);
      if (el) this.grid.appendChild(el);
    });
  }
}

let dashboard;
window.addEventListener('DOMContentLoaded', () => {
  dashboard = new DashboardManager();
});
</script>
