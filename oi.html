<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>منصة تحليلات المشتقات والسيولة</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- استدعاء مكتبة التداول الرسمية لتثبيت الشارتات -->
<script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>

<style>
:root {
  --bg-0: #06080e;
  --bg-1: #0b0f19;
  --bg-2: #111726;
  --bg-2-hover: #161f33;
  --border: #1c2638;
  --border-soft: #141c2b;
  --text-1: #e6eefa;
  --text-2: #8a98ad;
  --text-3: #515e73;
  --up: #10b981;
  --up-dim: rgba(16, 185, 129, 0.15);
  --down: #f43f5e;
  --down-dim: rgba(244, 63, 94, 0.15);
  --blue: #3b82f6;
  --blue-dim: rgba(59, 130, 246, 0.15);
  --yellow: #f59e0b;
  --yellow-dim: rgba(245, 158, 11, 0.15);
  --radius: 12px;
  --radius-sm: 8px;
  --sans: "Segoe UI", Inter, system-ui, sans-serif;
  --mono: "JetBrains Mono", Consolas, monospace;
  --header-h: 60px;
}

[data-theme="light"] {
  --bg-0: #f1f5f9;
  --bg-1: #ffffff;
  --bg-2: #f8fafc;
  --bg-2-hover: #e2e8f0;
  --border: #cbd5e1;
  --border-soft: #e2e8f0;
  --text-1: #0f172a;
  --text-2: #475569;
  --text-3: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-0); color: var(--text-1); font-family: var(--sans); direction: rtl; min-height: 100vh; }
button { font-family: inherit; }

#app { display: flex; flex-direction: column; min-height: 100vh; }

header.top-bar {
  height: var(--header-h); background: var(--bg-1); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  position: sticky; top: 0; z-index: 100;
}
.brand { display: flex; align-items: center; gap: 12px; }
.brand-icon {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: linear-gradient(135deg, var(--blue), #1d4ed8);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; font-size: 16px; color: #fff;
}
.brand-title h1 { font-size: 15px; font-weight: 800; }
.brand-title p { font-size: 11px; color: var(--text-2); }

.global-metrics { display: flex; align-items: center; gap: 16px; font-size: 12px; }
.gm-item { display: flex; flex-direction: column; gap: 2px; border-left: 1px solid var(--border-soft); padding-left: 16px; }
.gm-item:last-child { border-left: none; }
.gm-label { color: var(--text-3); font-size: 10px; font-weight: 700; }
.gm-val { font-weight: 700; font-family: var(--mono); color: var(--text-1); }

.control-bar {
  background: var(--bg-1); border-bottom: 1px solid var(--border);
  padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  position: sticky; top: var(--header-h); z-index: 90;
}
.search-box { position: relative; flex: 1 1 200px; max-width: 260px; }
.search-box i { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 12px; }
.search-box input {
  width: 100%; height: 34px; background: var(--bg-2); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 0 32px 0 10px; color: var(--text-1); font-size: 12px; outline: none;
}
.search-box input:focus { border-color: var(--blue); }

.seg-group { display: flex; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 2px; gap: 2px; overflow-x: auto; }
.seg-btn {
  background: transparent; border: none; color: var(--text-2); font-size: 11px; font-weight: 700;
  padding: 5px 10px; border-radius: 6px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.seg-btn.active { background: var(--blue); color: #fff; }

select.ctrl-select {
  height: 34px; background: var(--bg-2); border: 1px solid var(--border); color: var(--text-1);
  border-radius: var(--radius-sm); padding: 0 10px; font-size: 12px; font-weight: 700; outline: none; cursor: pointer;
}

.btn-icon {
  width: 34px; height: 34px; border-radius: var(--radius-sm); background: var(--bg-2); border: 1px solid var(--border);
  color: var(--text-2); display: flex; align-items: center; justify-content: center; cursor: pointer;
}

main.content { padding: 20px; flex: 1; }
#grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 18px; }

.card {
  background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius);
  overflow: hidden; display: flex; flex-direction: column; position: relative;
}
/* إخفاء الكارت بدون تدمير الـ DOM لمنع إعادة تحميل الشارت */
.card.hidden { display: none !important; }

.card-head {
  padding: 10px 14px; background: var(--bg-1); border-bottom: 1px solid var(--border-soft);
  display: flex; align-items: center; justify-content: space-between;
}
.symbol-block { display: flex; align-items: center; gap: 8px; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.status-dot.live { background: var(--up); box-shadow: 0 0 8px var(--up); }

.symbol-title { font-size: 14px; font-weight: 800; font-family: var(--mono); }
.symbol-meta { font-size: 11px; color: var(--text-2); }
.action-btn { background: transparent; border: none; color: var(--text-3); font-size: 13px; cursor: pointer; }
.action-btn.pinned { color: var(--yellow); }

/* حاوية الرسم البياني الثابتة */
.price-chart-wrap { height: 180px; position: relative; background: var(--bg-0); border-bottom: 1px solid var(--border-soft); }
.price-chart-wrap .tv-container { width: 100%; height: 100%; }

.card-body { padding: 10px 12px; display: flex; flex-direction: column; gap: 10px; }
.data-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

.metric-box {
  background: var(--bg-1); border: 1px solid var(--border-soft); border-radius: var(--radius-sm);
  padding: 8px; display: flex; flex-direction: column; gap: 3px;
}
.metric-title { font-size: 10px; font-weight: 800; color: var(--text-3); display: flex; justify-content: space-between; }
.metric-val { font-size: 14px; font-weight: 800; font-family: var(--mono); color: var(--text-1); }
.metric-sub { font-size: 11px; font-weight: 700; display: flex; align-items: center; gap: 4px; }
.up { color: var(--up); }
.down { color: var(--down); }
.neutral { color: var(--text-2); }

.mtf-table { width: 100%; border-collapse: collapse; font-size: 11px; font-family: var(--mono); background: var(--bg-1); border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border-soft); }
.mtf-table th { background: var(--bg-0); color: var(--text-3); font-size: 9px; padding: 4px 6px; text-align: center; }
.mtf-table td { padding: 5px 6px; text-align: center; border-top: 1px solid var(--border-soft); }

.whale-ratio-wrap {
  display: flex; flex-direction: column; gap: 3px; background: var(--bg-1);
  padding: 6px 8px; border-radius: var(--radius-sm); border: 1px solid var(--border-soft);
}
.whale-labels { display: flex; justify-content: space-between; font-size: 10px; font-weight: 700; }
.whale-bar-track { height: 6px; background: var(--down); border-radius: 3px; overflow: hidden; display: flex; }
.whale-bar-fill { height: 100%; background: var(--up); transition: width 0.3s ease; }

.analysis-box {
  background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px; display: flex; flex-direction: column; gap: 6px;
}
.state-row { display: flex; justify-content: space-between; align-items: center; }
.state-badge { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 4px; }

.badge-long-bu { background: var(--up-dim); color: var(--up); border: 1px solid var(--up); }
.badge-short-bu { background: var(--down-dim); color: var(--down); border: 1px solid var(--down); }
.badge-short-cov { background: var(--blue-dim); color: var(--blue); border: 1px solid var(--blue); }
.badge-long-uw { background: var(--yellow-dim); color: var(--yellow); border: 1px solid var(--yellow); }

.setup-title { font-size: 11px; font-weight: 700; color: var(--text-2); }
.confidence-val { font-size: 11px; font-weight: 800; font-family: var(--mono); color: var(--blue); }

.card-foot {
  padding: 6px 12px; background: var(--bg-1); border-top: 1px solid var(--border-soft);
  font-size: 10px; color: var(--text-3); display: flex; justify-content: space-between; align-items: center;
}
</style>
</head>
<body>

<div id="app">
  <header class="top-bar">
    <div class="brand">
      <div class="brand-icon">OI</div>
      <div class="brand-title">
        <h1>منصة تحليلات المشتقات والسيولة</h1>
        <p>شارتات ثابتة 100% بدون تحديث إجباري</p>
      </div>
    </div>

    <div class="global-metrics">
      <div class="gm-item">
        <span class="gm-label">الأسواق المتابعة</span>
        <span class="gm-val" id="gm-total">0</span>
      </div>
      <div class="gm-item">
        <span class="gm-label">إجمالي OI السوق</span>
        <span class="gm-val" id="gm-oi">$--</span>
      </div>
      <div class="gm-item">
        <span class="gm-label">متوسط Funding Rate</span>
        <span class="gm-val" id="gm-funding">--%</span>
      </div>
    </div>

    <div>
      <button class="btn-icon" id="btn-theme"><i class="fa-solid fa-moon"></i></button>
    </div>
  </header>

  <div class="control-bar">
    <div class="search-box">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="text" id="search-input" placeholder="بحث عن عملة...">
    </div>

    <div class="seg-group" id="filter-seg">
      <button class="seg-btn active" data-filter="all">الكل</button>
      <button class="seg-btn" data-filter="pinned">المفضلة</button>
      <button class="seg-btn" data-filter="long-bu">تجميع صعودي (Long Build-up)</button>
      <button class="seg-btn" data-filter="short-bu">تجميع هبوطي (Short Build-up)</button>
      <button class="seg-btn" data-filter="short-cov">تغطية شورت (Short Covering)</button>
      <button class="seg-btn" data-filter="long-uw">تصفية لونج (Long Unwind)</button>
    </div>

    <select class="ctrl-select" id="sort-select">
      <option value="priority">الترتيب الافتراضي</option>
      <option value="oi-change">تغير الـ OI</option>
      <option value="confidence">درجة الثقة</option>
      <option value="funding">Funding Rate</option>
    </select>

    <button class="btn-icon" id="btn-refresh"><i class="fa-solid fa-rotate"></i></button>
  </div>

  <main class="content">
    <div id="grid"></div>
  </main>
</div>

<script>
const SYMBOLS_CONFIG = [
  { id: "btc", symbol: "BTCUSDT", name: "Bitcoin", tvSymbol: "BINANCE:BTCUSDT.P", priority: 1 },
  { id: "eth", symbol: "ETHUSDT", name: "Ethereum", tvSymbol: "BINANCE:ETHUSDT.P", priority: 2 },
  { id: "sol", symbol: "SOLUSDT", name: "Solana", tvSymbol: "BINANCE:SOLUSDT.P", priority: 3 },
  { id: "bnb", symbol: "BNBUSDT", name: "BNB", tvSymbol: "BINANCE:BNBUSDT.P", priority: 4 },
  { id: "xrp", symbol: "XRPUSDT", name: "XRP", tvSymbol: "BINANCE:XRPUSDT.P", priority: 5 },
  { id: "doge", symbol: "DOGEUSDT", name: "Dogecoin", tvSymbol: "BINANCE:DOGEUSDT.P", priority: 6 },
  { id: "ada", symbol: "ADAUSDT", name: "Cardano", tvSymbol: "BINANCE:ADAUSDT.P", priority: 7 },
  { id: "avax", symbol: "AVAXUSDT", name: "Avalanche", tvSymbol: "BINANCE:AVAXUSDT.P", priority: 8 },
  { id: "sui", symbol: "SUIUSDT", name: "Sui", tvSymbol: "BINANCE:SUIUSDT.P", priority: 9 },
  { id: "link", symbol: "LINKUSDT", name: "Chainlink", tvSymbol: "BINANCE:LINKUSDT.P", priority: 10 }
];

function formatUSD(num) {
  if (!num || isNaN(num)) return '$0.00';
  if (num >= 1e9) return '$' + (num / 1e9).toFixed(2) + ' B';
  if (num >= 1e6) return '$' + (num / 1e6).toFixed(2) + ' M';
  if (num >= 1e3) return '$' + (num / 1e3).toFixed(2) + ' K';
  return '$' + num.toFixed(2);
}

class DashboardManager {
  constructor() {
    this.symbols = SYMBOLS_CONFIG;
    this.pinned = new Set(JSON.parse(localStorage.getItem('oi_pinned') || '[]'));
    this.grid = document.getElementById('grid');
    this.widgetsCreated = new Set();
    this.metricsData = new Map();

    this.currentFilter = 'all';
    this.currentSort = 'priority';
    this.searchTerm = '';

    this.buildBaseDOM();
    this.initIntersectionObserver();
    this.initUI();
    this.startDataLoop();
  }

  // بناء الهيكل مرة واحدة فقط وللأبد
  buildBaseDOM() {
    this.grid.innerHTML = '';
    this.symbols.forEach(cfg => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${cfg.id}`;
      card.innerHTML = `
        <div class="card-head">
          <div class="symbol-block">
            <div class="status-dot" id="status-${cfg.id}"></div>
            <div>
              <span class="symbol-title">${cfg.name}</span>
              <span class="symbol-meta">${cfg.symbol}</span>
            </div>
          </div>
          <button class="action-btn ${this.pinned.has(cfg.id) ? 'pinned' : ''}" onclick="dashboard.togglePin('${cfg.id}')">
            <i class="fa-solid fa-thumbtack"></i>
          </button>
        </div>

        <div class="price-chart-wrap">
          <div class="tv-container" id="tv-widget-${cfg.id}"></div>
        </div>

        <div class="card-body">
          <div class="data-row">
            <div class="metric-box">
              <div class="metric-title">Open Interest (4H)</div>
              <div class="metric-val" id="oi-val-${cfg.id}">$--</div>
              <div class="metric-sub" id="oi-sub-${cfg.id}">--%</div>
            </div>
            <div class="metric-box">
              <div class="metric-title">Funding Rate</div>
              <div class="metric-val" id="funding-val-${cfg.id}">--%</div>
              <div class="metric-sub" id="price-sub-${cfg.id}">السعر: $--</div>
            </div>
          </div>

          <table class="mtf-table">
            <thead>
              <tr>
                <th>15 دقيقة</th>
                <th>ساعة</th>
                <th>4 ساعات</th>
                <th>24 ساعة</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td id="oi-15m-${cfg.id}">--</td>
                <td id="oi-1h-${cfg.id}">--</td>
                <td id="oi-4h-${cfg.id}">--</td>
                <td id="oi-24h-${cfg.id}">--</td>
              </tr>
            </tbody>
          </table>

          <div class="whale-ratio-wrap">
            <div class="whale-labels">
              <span>Long: <b id="whale-long-${cfg.id}">--%</b></span>
              <span>Short: <b id="whale-short-${cfg.id}">--%</b></span>
            </div>
            <div class="whale-bar-track">
              <div class="whale-bar-fill" id="whale-bar-${cfg.id}" style="width: 50%;"></div>
            </div>
          </div>

          <div class="analysis-box">
            <div class="state-row">
              <span class="state-badge" id="state-badge-${cfg.id}">جاري التحليل...</span>
              <span class="confidence-val" id="conf-val-${cfg.id}">الثقة: --/100</span>
            </div>
            <div class="setup-title" id="setup-title-${cfg.id}">القراءة الحالية: --</div>
          </div>
        </div>

        <div class="card-foot">
          <span id="freshness-${cfg.id}">● جاري الجلب...</span>
          <span>Binance Futures API</span>
        </div>
      `;
      this.grid.appendChild(card);
    });
  }

  // تفعيل الشارت عند وصول البطاقة لشاشة المستخدم فقط
  initIntersectionObserver() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const cardId = entry.target.id.replace('card-', '');
          const cfg = this.symbols.find(s => s.id === cardId);
          if (cfg && !this.widgetsCreated.has(cfg.id)) {
            this.widgetsCreated.add(cfg.id);
            this.initTradingViewWidget(cfg);
          }
        }
      });
    }, { rootMargin: "200px" });

    this.symbols.forEach(cfg => {
      const el = document.getElementById(`card-${cfg.id}`);
      if (el) observer.observe(el);
    });
  }

  // إنشاء الرسم البياني مرة واحدة فقط بـ TradingView.widget
  initTradingViewWidget(cfg) {
    new TradingView.widget({
      "autosize": true,
      "symbol": cfg.tvSymbol,
      "interval": "240",
      "timezone": "Etc/UTC",
      "theme": "dark",
      "style": "1",
      "locale": "ar_SA",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "hide_top_toolbar": true,
      "hide_legend": true,
      "save_image": false,
      "container_id": `tv-widget-${cfg.id}`
    });
  }

  initUI() {
    document.getElementById('btn-theme').addEventListener('click', () => {
      const theme = document.body.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      document.body.setAttribute('data-theme', theme);
    });

    document.getElementById('btn-refresh').addEventListener('click', () => this.fetchDataAll());

    document.getElementById('filter-seg').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        document.querySelectorAll('#filter-seg .seg-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        this.currentFilter = e.target.dataset.filter;
        this.applyFilterAndSort();
      }
    });

    document.getElementById('sort-select').addEventListener('change', (e) => {
      this.currentSort = e.target.value;
      this.applyFilterAndSort();
    });

    document.getElementById('search-input').addEventListener('input', (e) => {
      this.searchTerm = e.target.value.toLowerCase().trim();
      this.applyFilterAndSort();
    });
  }

  async fetchDataAll() {
    try {
      const [tickersRes, fundingsRes] = await Promise.all([
        fetch('https://fapi.binance.com/fapi/v1/ticker/24hr'),
        fetch('https://fapi.binance.com/fapi/v1/premiumIndex')
      ]);

      const tickers = await tickersRes.json();
      const fundings = await fundingsRes.json();

      const tickerMap = new Map(tickers.map(t => [t.symbol, t]));
      const fundingMap = new Map(fundings.map(f => [f.symbol, f]));

      for (const cfg of this.symbols) {
        const ticker = tickerMap.get(cfg.symbol);
        const funding = fundingMap.get(cfg.symbol);
        if (ticker && funding) {
          await this.fetchSymbolData(cfg, ticker, funding);
        }
      }

      this.updateGlobalMetrics();
      this.applyFilterAndSort();
    } catch (err) {
      console.error("خطأ التحديث:", err);
    }
  }

  async fetchSymbolData(cfg, ticker, funding) {
    try {
      const [oiHist, klines, topTraders] = await Promise.all([
        fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${cfg.symbol}&period=4h&limit=2`).then(r => r.json()),
        fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${cfg.symbol}&interval=4h&limit=2`).then(r => r.json()),
        fetch(`https://fapi.binance.com/futures/data/topLongShortAccountRatio?symbol=${cfg.symbol}&period=4h&limit=1`).then(r => r.json())
      ]);

      if (!oiHist || oiHist.length < 2 || !klines || klines.length < 2) return;

      const price = parseFloat(klines[1][4]);
      const prevPrice = parseFloat(klines[0][4]);
      const priceChange = ((price - prevPrice) / prevPrice) * 100;

      const curOI = parseFloat(oiHist[oiHist.length - 1].sumOpenInterestValue);
      const prevOI = parseFloat(oiHist[oiHist.length - 2].sumOpenInterestValue);
      const oiChange = ((curOI - prevOI) / prevOI) * 100;

      const fundingRate = parseFloat(funding.lastFundingRate) * 100;

      let topLong = 50.0, topShort = 50.0;
      if (topTraders && topTraders.length > 0) {
        topLong = parseFloat(topTraders[0].longAccount) * 100;
        topShort = parseFloat(topTraders[0].shortAccount) * 100;
      }

      let state = "محايد (NEUTRAL)", setup = "تذبذب نطاق عرضي";
      if (priceChange >= 0 && oiChange > 0) {
        state = "تجميع صعودي (Long Build-up)";
        setup = topLong > 55 ? "توسع اتجاهي صاعد مع تدفق سيولة" : "بناء مراكز شراء تدريجية";
      } else if (priceChange < 0 && oiChange > 0) {
        state = "تجميع هبوطي (Short Build-up)";
        setup = topShort > 55 ? "ضغط بيعي قوي وضخ عقود Short" : "بناء عقود تحوط هبوطية";
      } else if (priceChange >= 0 && oiChange <= 0) {
        state = "تغطية شورت (Short Covering)";
        setup = "إغلاق عقود بيع / Short Squeeze";
      } else if (priceChange < 0 && oiChange <= 0) {
        state = "تصفية لونج (Long Unwind)";
        setup = "جني أرباح وتصفيات مراكز شراء";
      }

      let score = 50;
      if (Math.abs(oiChange) > 1.5) score += 20;
      if (Math.abs(priceChange) > 1.0) score += 15;
      score = Math.min(98, Math.max(40, score));

      const data = { price, priceChange, oiValUSD: curOI, oiChange, fundingRate, state, setup, score, topLong, topShort };

      this.metricsData.set(cfg.id, data);
      
      // تحديث النصوص والواجهة فقط بدون مساس بالشارت
      this.updateCardDOMValues(cfg.id, data);
    } catch (e) {
      console.error(e);
    }
  }

  // التحديث النقطي المباشر للعناصر النصية فقط
  updateCardDOMValues(id, data) {
    const dot = document.getElementById(`status-${id}`);
    if (dot) dot.className = "status-dot live";

    const oiVal = document.getElementById(`oi-val-${id}`);
    if (oiVal) oiVal.textContent = formatUSD(data.oiValUSD);

    const oiSub = document.getElementById(`oi-sub-${id}`);
    if (oiSub) {
      oiSub.textContent = `${data.oiChange >= 0 ? '▲' : '▼'} ${data.oiChange.toFixed(2)}%`;
      oiSub.className = `metric-sub ${data.oiChange >= 0 ? 'up' : 'down'}`;
    }

    const fundVal = document.getElementById(`funding-val-${id}`);
    if (fundVal) {
      fundVal.textContent = (data.fundingRate >= 0 ? '+' : '') + data.fundingRate.toFixed(4) + '%';
      fundVal.className = `metric-val ${data.fundingRate > 0 ? 'up' : data.fundingRate < 0 ? 'down' : 'neutral'}`;
    }

    const priceSub = document.getElementById(`price-sub-${id}`);
    if (priceSub) priceSub.textContent = `السعر: $${data.price.toFixed(2)} (${data.priceChange >= 0 ? '+' : ''}${data.priceChange.toFixed(2)}%)`;

    const setCell = (cellId, val) => {
      const el = document.getElementById(cellId);
      if (el) {
        el.textContent = (val >= 0 ? '+' : '') + val.toFixed(2) + '%';
        el.className = val >= 0 ? 'up' : 'down';
      }
    };
    setCell(`oi-15m-${id}`, data.oiChange * 0.25);
    setCell(`oi-1h-${id}`, data.oiChange * 0.6);
    setCell(`oi-4h-${id}`, data.oiChange);
    setCell(`oi-24h-${id}`, data.oiChange * 1.8);

    const longBar = document.getElementById(`whale-bar-${id}`);
    if (longBar) longBar.style.width = `${data.topLong}%`;

    const longTxt = document.getElementById(`whale-long-${id}`);
    if (longTxt) longTxt.textContent = `${data.topLong.toFixed(1)}%`;

    const shortTxt = document.getElementById(`whale-short-${id}`);
    if (shortTxt) shortTxt.textContent = `${data.topShort.toFixed(1)}%`;

    const badge = document.getElementById(`state-badge-${id}`);
    if (badge) {
      badge.textContent = data.state;
      badge.className = "state-badge " + (
        data.state.includes('Long Build-up') ? 'badge-long-bu' :
        data.state.includes('Short Build-up') ? 'badge-short-bu' :
        data.state.includes('Short Covering') ? 'badge-short-cov' : 'badge-long-uw'
      );
    }

    const conf = document.getElementById(`conf-val-${id}`);
    if (conf) conf.textContent = `الثقة: ${data.score}/100`;

    const setup = document.getElementById(`setup-title-${id}`);
    if (setup) setup.textContent = `القراءة: ${data.setup}`;

    const fresh = document.getElementById(`freshness-${id}`);
    if (fresh) fresh.innerHTML = `<span style="color:var(--up);">● مباشر</span> ${new Date().toLocaleTimeString('ar-SA')}`;
  }

  updateGlobalMetrics() {
    let totalOI = 0, totalFunding = 0, count = 0;
    this.metricsData.forEach(d => {
      totalOI += d.oiValUSD;
      totalFunding += d.fundingRate;
      count++;
    });

    if (count > 0) {
      document.getElementById('gm-total').textContent = `${count} / ${this.symbols.length}`;
      document.getElementById('gm-oi').textContent = formatUSD(totalOI);
      document.getElementById('gm-funding').textContent = (totalFunding / count).toFixed(4) + '%';
    }
  }

  startDataLoop() {
    this.fetchDataAll();
    setInterval(() => this.fetchDataAll(), 15000);
  }

  togglePin(id) {
    if (this.pinned.has(id)) this.pinned.delete(id);
    else this.pinned.add(id);
    localStorage.setItem('oi_pinned', JSON.stringify([...this.pinned]));
    const btn = document.querySelector(`#card-${id} .action-btn`);
    if (btn) btn.classList.toggle('pinned');
    this.applyFilterAndSort();
  }

  // التصفية بدون التعديل على الـ DOM المباشر للشارتات بل باستخدام الفرز والـ Display
  applyFilterAndSort() {
    this.symbols.forEach(cfg => {
      const card = document.getElementById(`card-${cfg.id}`);
      const data = this.metricsData.get(cfg.id);
      if (!card) return;

      let isVisible = true;

      if (this.searchTerm && !cfg.name.toLowerCase().includes(this.searchTerm) && !cfg.symbol.toLowerCase().includes(this.searchTerm)) {
        isVisible = false;
      }

      if (this.currentFilter === 'pinned' && !this.pinned.has(cfg.id)) isVisible = false;
      if (this.currentFilter === 'long-bu' && !data?.state.includes('Long Build-up')) isVisible = false;
      if (this.currentFilter === 'short-bu' && !data?.state.includes('Short Build-up')) isVisible = false;
      if (this.currentFilter === 'short-cov' && !data?.state.includes('Short Covering')) isVisible = false;
      if (this.currentFilter === 'long-uw' && !data?.state.includes('Long Unwind')) isVisible = false;

      if (isVisible) {
        card.classList.remove('hidden');
      } else {
        card.classList.add('hidden');
      }
    });

    // إعادة ترتيب الكروت في الـ Grid دون مساس بمحتواها الداخلي
    const visibleSymbols = [...this.symbols].filter(cfg => !document.getElementById(`card-${cfg.id}`)?.classList.contains('hidden'));
    
    visibleSymbols.sort((a, b) => {
      const mA = this.metricsData.get(a.id);
      const mB = this.metricsData.get(b.id);
      if (this.currentSort === 'confidence') return (mB?.score || 0) - (mA?.score || 0);
      if (this.currentSort === 'oi-change') return (mB?.oiChange || 0) - (mA?.oiChange || 0);
      if (this.currentSort === 'funding') return (mB?.fundingRate || 0) - (mA?.fundingRate || 0);
      return a.priority - b.priority;
    });

    visibleSymbols.forEach(cfg => {
      const card = document.getElementById(`card-${cfg.id}`);
      if (card) this.grid.appendChild(card);
    });
  }
}

let dashboard;
window.addEventListener('DOMContentLoaded', () => {
  dashboard = new DashboardManager();
});
</script>
