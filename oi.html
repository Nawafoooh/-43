<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Pro - Order Flow State Machine</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tv-header {
            height: 50px;
            background-color: #1e222d;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 20px;
        }
        select {
            background-color: #2a2e39;
            color: #f0f3fa;
            border: 1px solid #434651;
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
        }
        select:hover { border-color: #2962ff; }

        .timeframe-group {
            display: flex;
            gap: 4px;
            background-color: #2a2e39;
            padding: 3px;
            border-radius: 4px;
        }
        .tf-btn {
            background: none;
            border: none;
            color: #787b86;
            padding: 4px 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 3px;
            cursor: pointer;
        }
        .tf-btn.active, .tf-btn:hover { background-color: #363a45; color: #f0f3fa; }
        .tf-btn.active { color: #2962ff; }

        /* شريط المساعد بتنسيق الحالات الخمس الاحترافية */
        .market-assistant {
            background: linear-gradient(90deg, #181b25 0%, #222735 100%);
            border-bottom: 1px solid #2a2e39;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .assistant-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #f0f3fa;
        }
        
        /* شارات الحالة (State Badges) */
        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            display: inline-block;
        }
        .badge-wait { background-color: #434651; color: #d1d4dc; }
        .badge-long { background-color: #089981; color: #ffffff; box-shadow: 0 0 10px rgba(8, 153, 129, 0.4); }
        .badge-short { background-color: #f23645; color: #ffffff; box-shadow: 0 0 10px rgba(242, 54, 69, 0.4); }
        .badge-watch { background-color: #ffa726; color: #131722; box-shadow: 0 0 10px rgba(255, 167, 38, 0.4); }
        .badge-unwind { background-color: #2962ff; color: #ffffff; }

        .assistant-msg {
            color: #d1d4dc;
            font-weight: 500;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .live-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: auto;
            font-size: 12px;
            font-weight: bold;
            color: #089981;
        }
        .live-dot {
            width: 8px; height: 8px;
            background-color: #089981;
            border-radius: 50%;
            box-shadow: 0 0 8px #089981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }

        .main-container { flex: 1; position: relative; width: 100%; }
        #chart-container { width: 100%; height: 100%; }

        .chart-legend {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            font-size: 12px;
            color: #b2b5be;
            background: rgba(19, 23, 34, 0.85);
            padding: 6px 12px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            border: 1px solid #2a2e39;
            pointer-events: none;
            display: flex;
            gap: 16px;
        }
        .legend-item { display: flex; gap: 4px; align-items: center; }
        .legend-title { font-weight: 600; color: #787b86; }
        .legend-value { font-weight: bold; }
        .up { color: #089981; }
        .down { color: #f23645; }
    </style>
</head>
<body>

    <div class="tv-header">
        <div class="symbol-selector">
            <select id="symbol" onchange="switchSymbol()"></select>
        </div>

        <div class="timeframe-group">
            <button class="tf-btn" onclick="changeInterval('1h')">1H</button>
            <button class="tf-btn active" onclick="changeInterval('4h')">4H</button>
            <button class="tf-btn" onclick="changeInterval('1d')">1D</button>
        </div>

        <div class="live-status">
            <div class="live-dot"></div>
            <span>LIVE BINANCE FUTURES</span>
        </div>
    </div>

    <!-- شريط المحلل الذكي المبني على Order Flow State Machine -->
    <div class="market-assistant">
        <div class="assistant-title">
            <span id="stateBadge" class="status-badge badge-wait">⚪ WAIT</span>
            <span>حالة هيكل السيولة:</span>
        </div>
        <div class="assistant-msg" id="assistantText">
            جاري قراءة بنية السعر والسيولة وتغير معدل التمويل (Price + OI + Funding State Engine)...
        </div>
    </div>

    <div class="main-container">
        <div class="chart-legend" id="legend">
            <div class="legend-item"><span class="legend-title">Price:</span> <span id="price-val" class="legend-value">-</span></div>
            <div class="legend-item"><span class="legend-title">OI:</span> <span id="oi-val" class="legend-value">-</span></div>
            <div class="legend-item"><span class="legend-title">Vol:</span> <span id="vol-val" class="legend-value">-</span></div>
            <div class="legend-item"><span class="legend-title">Funding:</span> <span id="funding-val" class="legend-value">-</span></div>
        </div>
        <div id="chart-container"></div>
    </div>

<script>
    const top50Symbols = [
        "ETHUSDT", "BTCUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "SUIUSDT", "LINKUSDT",
        "NEARUSDT", "APTUSDT", "DOTUSDT", "LTCUSDT", "MATICUSDT", "SHIBUSDT", "PEPEUSDT", "FETUSDT", "ARBUSDT", "OPUSDT",
        "INJUSDT", "RNDRUSDT", "TIAUSDT", "SEIUSDT", "STXUSDT", "FILUSDT", "ATOMUSDT", "WIFUSDT", "FLOKIUSDT", "BONKUSDT",
        "TRXUSDT", "BCHUSDT", "ETCUSDT", "XLMUSDT", "ALGOUSDT", "AAVEUSDT", "UNIUSDT", "RENDERUSDT", "TAOUSDT", "ORDIUSDT",
        "SBDUSDT", "GMXUSDT", "DYDXUSDT", "FTMUSDT", "CRVUSDT", "LDOUSDT", "RUNEUSDT", "EGLDUSDT", "KASUSDT", "BLURUSDT"
    ];

    let currentSymbol = "ETHUSDT";
    let currentInterval = "4h";
    
    let chart;
    let priceSeries, oiSeries, volumeSeries, fundingSeries;
    let ws;
    let cachedPriceData = [], cachedOIData = [], cachedFundingData = [];

    function populateSymbols() {
        const select = document.getElementById('symbol');
        select.innerHTML = '';
        top50Symbols.forEach(sym => {
            const opt = document.createElement('option');
            opt.value = sym;
            opt.textContent = sym.replace('USDT', ' / USDT');
            select.appendChild(opt);
        });
    }

    function formatNumber(val) {
        if (val >= 1000000) return (val / 1000000).toFixed(3) + 'M';
        if (val >= 1000) return (val / 1000).toFixed(2) + 'K';
        return val.toFixed(2);
    }

    function getOICandleColor(priceIsUp, oiIsUp) {
        if (priceIsUp && oiIsUp) return '#089981';       
        if (!priceIsUp && !oiIsUp) return '#f23645';     
        if (!priceIsUp && oiIsUp) return '#000000';      
        if (priceIsUp && !oiIsUp) return '#2962ff';      
        return '#787b86';
    }

    // 🔥 المحرك المطور الصارم: Order Flow State Machine Engine
    function evaluateOrderFlowEngine(targetIndex) {
        const badgeEl = document.getElementById('stateBadge');
        const textEl = document.getElementById('assistantText');
        
        const LOOKBACK_EXTENDED = 12; // نطاق قراءة الحركة الممتدة
        const LOOKBACK_SHORT = 3;     // نطاق قراءة التغير اللحظي القريب

        if (!cachedPriceData || cachedPriceData.length < LOOKBACK_EXTENDED || targetIndex < LOOKBACK_EXTENDED) {
            badgeEl.className = "status-badge badge-wait";
            badgeEl.innerText = "⚪ WAIT";
            textEl.innerText = "بيانات غير كافية لبناء الهيكل التراكمي.";
            return;
        }

        // 1. حسابات الحركة الممتدة (Context Movement)
        const extendedStartPrice = cachedPriceData[targetIndex - LOOKBACK_EXTENDED].open;
        const currentPrice = cachedPriceData[targetIndex].close;
        const extendedPricePct = ((currentPrice - extendedStartPrice) / extendedStartPrice) * 100;

        const extendedStartOI = cachedOIData[targetIndex - LOOKBACK_EXTENDED].open;
        const currentOI = cachedOIData[targetIndex].close;
        const extendedOIPct = ((currentOI - extendedStartOI) / extendedStartOI) * 100;

        // 2. حسابات الحركة القريبة اللحظية (3 Bars Dynamics)
        const shortStartPrice = cachedPriceData[targetIndex - LOOKBACK_SHORT].open;
        const shortPricePct = ((currentPrice - shortStartPrice) / shortStartPrice) * 100;

        const shortStartOI = cachedOIData[targetIndex - LOOKBACK_SHORT].open;
        const shortOIPct = ((currentOI - shortStartOI) / shortStartOI) * 100;

        // 3. تحليل ديناميكية الفندنج (Funding State & Velocity)
        const curFunding = cachedFundingData[targetIndex] ? cachedFundingData[targetIndex].value : 0;
        const prevFunding = cachedFundingData[targetIndex - LOOKBACK_SHORT] ? cachedFundingData[targetIndex - LOOKBACK_SHORT].value : curFunding;
        const fundingDelta = curFunding - prevFunding;

        let fundingStateText = "";
        if (curFunding > 0.0002 && fundingDelta > 0) {
            fundingStateText = "Funding موجبة متسارعة (تسخين رافعات الشراء)";
        } else if (curFunding > 0.0002 && fundingDelta <= 0) {
            fundingStateText = "Funding موجبة لكنها تتراجع";
        } else if (curFunding < -0.0001 && fundingDelta < 0) {
            fundingStateText = "Funding سالبة تزداد حدة (تضخم الشورتات)";
        } else if (curFunding < -0.0001 && fundingDelta >= 0) {
            fundingStateText = "Funding سالبة لكنها ترتد للتحسن";
        } else {
            fundingStateText = "Funding متوازنة";
        }

        // 4. تقييم القمم والقيعان المحلية (High/Low Failures)
        const recentSlice = cachedPriceData.slice(targetIndex - 5, targetIndex + 1);
        const maxHigh = Math.max(...recentSlice.map(p => p.high));
        const minLow = Math.min(...recentSlice.map(p => p.low));
        
        const isFailingHigh = extendedPricePct > 5 && (currentPrice < maxHigh * 0.993);
        const isFailingLow = extendedPricePct < -5 && (currentPrice > minLow * 1.007);

        // --- تنفيذ منطق حالات السوق (State Machine logic) ---

        // A. إشارات التصفية وتفكيك المراكز (POSITION UNWINDING)
        if (Math.abs(extendedPricePct) > 3 && shortOIPct < -1.5) {
            badgeEl.className = "status-badge badge-unwind";
            badgeEl.innerText = "🔵 POSITION UNWINDING";
            textEl.innerHTML = `الحركة ناتجة عن إغلاق وتفريغ عقود وليس بناء اتجاه جديد (OI ينخفض بـ ${shortOIPct.toFixed(2)}%). لا يوصى بالدخول. | <small>${fundingStateText}</small>`;
            return;
        }

        // B. مراقبة الانعكاس من الصعود (SELLING / BULL EXHAUSTION WATCH)
        if (extendedPricePct > 6 && (curFunding > 0.0003 || extendedOIPct > 8)) {
            if (isFailingHigh && shortPricePct < 0 && shortOIPct >= 0) {
                // تأكيد الضغط البيعي (Phase E / Confirmation)
                badgeEl.className = "status-badge badge-short";
                badgeEl.innerText = "🔴 SHORT BIAS CONFIRMED";
                textEl.innerHTML = `تأكيد انعكاس بيعي: صعود ممتد (+${extendedPricePct.toFixed(1)}%) متبوع بضعف عن تحقيق قمة جديدة وزيادة في عقود البيع (Short Building). | <small>${fundingStateText}</small>`;
            } else {
                // مراقبة إنهاك صعودي (Phase C / Extreme)
                badgeEl.className = "status-badge badge-watch";
                badgeEl.innerText = "🟡 BULL EXHAUSTION WATCH";
                textEl.innerHTML = `صعود ممتد (+${extendedPricePct.toFixed(1)}%) مع ارتفاع متطرف في OI/Funding. توجد علامات إنهاك، ننتظر تأكيد الانعكاس. | <small>${fundingStateText}</small>`;
            }
            return;
        }

        // C. مراقبة الانعكاس من الهبوط (BUYING / BEAR EXHAUSTION WATCH)
        if (extendedPricePct < -6 && (curFunding < -0.0001 || extendedOIPct > 8)) {
            if (isFailingLow && shortPricePct > 0 && shortOIPct < 0) {
                // تأكيد التجميع والارتداد (Phase E / Confirmation)
                badgeEl.className = "status-badge badge-long";
                badgeEl.innerText = "🟢 LONG BIAS CONFIRMED";
                textEl.innerHTML = `تأكيد انعكاس صاعد: هبوط ممتد (${extendedPricePct.toFixed(1)}%) مع توقف الهبوط وتراجع عقود الشورت (Short Unwinding). | <small>${fundingStateText}</small>`;
            } else if (shortPricePct < 0 && shortOIPct > 0.8) {
                // امتصاص وتجميع خفي أثناء الهبوط (Absorption Phase)
                badgeEl.className = "status-badge badge-watch";
                badgeEl.innerText = "🟡 ABSORPTION / REVERSAL WATCH";
                textEl.innerHTML = `هبوط ممتد مع استمرار ارتفاع الـ OI (+${shortOIPct.toFixed(2)}%) وتعمق الفندنج السلبي. احتمالية امتصاص بيعي وتهيؤ لارتقاء صاعد. | <small>${fundingStateText}</small>`;
            } else {
                badgeEl.className = "status-badge badge-watch";
                badgeEl.innerText = "🟡 BEAR EXHAUSTION WATCH";
                textEl.innerHTML = `هبوط ممتد (${extendedPricePct.toFixed(1)}%) وصل لمناطق متطرفة. ننتظر دليلاً بنيوياً قبل تحديد Bias صاعد. | <small>${fundingStateText}</small>`;
            }
            return;
        }

        // D. الاتجاهات القوية الممتدة الصحيحة (TREND CONTINUATION)
        if (extendedPricePct > 4 && shortPricePct > 0 && shortOIPct > 0) {
            badgeEl.className = "status-badge badge-long";
            badgeEl.innerText = "🟢 STRONG LONG BIAS";
            textEl.innerHTML = `اتجاه صاعد صحي ومستمر: صعود متبوع بتدفق سيولة جديدة (Price +${shortPricePct.toFixed(2)}% | OI +${shortOIPct.toFixed(2)}%). | <small>${fundingStateText}</small>`;
            return;
        }

        if (extendedPricePct < -4 && shortPricePct < 0 && shortOIPct > 0) {
            badgeEl.className = "status-badge badge-short";
            badgeEl.innerText = "🔴 STRONG SHORT BIAS";
            textEl.innerHTML = `اتجاه هابط صريح: ضغط بيعي متواصل بدخول مراكز شورت جديدة. | <small>${fundingStateText}</small>`;
            return;
        }

        // E. الحالة الافتراضية والأساسية (DEFAULT STATE: WAIT)
        badgeEl.className = "status-badge badge-wait";
        badgeEl.innerText = "⚪ WAIT";
        textEl.innerHTML = `البيانات متضاربة أو داخل نطاق متوازن. لا توجد أفضلية إحصائية واضحة حالياً (Price 3B: ${shortPricePct.toFixed(2)}% | OI 3B: ${shortOIPct.toFixed(2)}%). | <small>${fundingStateText}</small>`;
    }

    function initChart() {
        const container = document.getElementById('chart-container');
        
        chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: { backgroundColor: '#131722', textColor: '#787b86', fontSize: 11 },
            grid: {
                vertLines: { color: 'rgba(42, 46, 57, 0.3)' },
                horzLines: { color: 'rgba(42, 46, 57, 0.3)' }
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
                borderColor: '#2a2e39',
                tickMarkFormatter: (time) => {
                    const date = new Date(time * 1000);
                    const hours = date.getHours().toString().padStart(2, '0');
                    const minutes = date.getMinutes().toString().padStart(2, '0');
                    const month = (date.getMonth() + 1).toString().padStart(2, '0');
                    const day = date.getDate().toString().padStart(2, '0');
                    return currentInterval === '1d' ? `${month}/${day}` : `${month}/${day} ${hours}:${minutes}`;
                }
            },
            rightPriceScale: { visible: true, borderColor: '#2a2e39' }
        });

        priceSeries = chart.addCandlestickSeries({
            priceScaleId: 'right',
            upColor: '#089981', downColor: '#f23645',
            borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
        });

        oiSeries = chart.addCandlestickSeries({
            priceScaleId: 'oiScale',
            borderVisible: false,
            priceFormat: { type: 'custom', formatter: price => formatNumber(price) },
        });

        volumeSeries = chart.addHistogramSeries({
            priceScaleId: 'volScale',
            priceFormat: { type: 'volume' }
        });

        fundingSeries = chart.addBaselineSeries({
            priceScaleId: 'fundingScale',
            baseValue: { type: 'price', price: 0 },
            topLineColor: '#089981', topFillColor1: 'rgba(8, 153, 129, 0.2)', topFillColor2: 'rgba(8, 153, 129, 0.0)',
            bottomLineColor: '#f23645', bottomFillColor1: 'rgba(242, 54, 69, 0.0)', bottomFillColor2: 'rgba(242, 54, 69, 0.2)',
            lineWidth: 2
        });

        chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.02, bottom: 0.52 } });
        chart.priceScale('oiScale').applyOptions({ scaleMargins: { top: 0.52, bottom: 0.32 }, autoScale: true });
        chart.priceScale('volScale').applyOptions({ scaleMargins: { top: 0.70, bottom: 0.16 } });
        chart.priceScale('fundingScale').applyOptions({ scaleMargins: { top: 0.86, bottom: 0.02 } });

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
        });

        chart.subscribeCrosshairMove(param => {
            if (param.time) {
                const pData = param.seriesData.get(priceSeries);
                const oiData = param.seriesData.get(oiSeries);
                const vData = param.seriesData.get(volumeSeries);
                const fData = param.seriesData.get(fundingSeries);

                if (pData) {
                    document.getElementById('price-val').innerText = pData.close.toFixed(2);
                    document.getElementById('price-val').className = `legend-value ${pData.close >= pData.open ? 'up' : 'down'}`;
                }
                if (oiData) {
                    document.getElementById('oi-val').innerText = formatNumber(oiData.close);
                }
                if (vData) {
                    document.getElementById('vol-val').innerText = formatNumber(vData.value);
                    document.getElementById('vol-val').className = `legend-value ${vData.color === '#089981' ? 'up' : 'down'}`;
                }
                if (fData) {
                    document.getElementById('funding-val').innerText = (fData.value * 100).toFixed(4) + '%';
                    document.getElementById('funding-val').className = `legend-value ${fData.value >= 0 ? 'up' : 'down'}`;
                }

                const hoverIdx = cachedPriceData.findIndex(item => item.time === param.time);
                if (hoverIdx !== -1) {
                    evaluateOrderFlowEngine(hoverIdx);
                }
            }
        });
    }

    async function loadHistoricalData() {
        try {
            const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${currentSymbol}&interval=${currentInterval}&limit=300`);
            const klineData = await klineRes.json();

            const oiRes = await fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${currentSymbol}&period=${currentInterval}&limit=500`);
            const oiData = await oiRes.json();

            const fundingRes = await fetch(`https://fapi.binance.com/fapi/v1/fundingRate?symbol=${currentSymbol}&limit=500`);
            const fundingData = await fundingRes.json();

            const oiMap = new Map();
            oiData.forEach(item => oiMap.set(Math.floor(item.timestamp / 1000), parseFloat(item.sumOpenInterest)));

            const fundingMap = new Map();
            fundingData.forEach(item => fundingMap.set(Math.floor(item.fundingTime / 1000), parseFloat(item.fundingRate)));

            cachedPriceData = [];
            cachedOIData = [];
            cachedFundingData = [];
            const volumeBars = [];

            let lastKnownOI = oiData.length > 0 ? parseFloat(oiData[0].sumOpenInterest) : 0;
            let lastKnownFunding = fundingData.length > 0 ? parseFloat(fundingData[0].fundingRate) : 0;

            klineData.forEach((d) => {
                const candleTime = d[0] / 1000;
                const openP = parseFloat(d[1]), highP = parseFloat(d[2]), lowP = parseFloat(d[3]), closeP = parseFloat(d[4]);
                const vol = parseFloat(d[5]);

                cachedPriceData.push({ time: candleTime, open: openP, high: highP, low: lowP, close: closeP });

                const priceIsUp = closeP >= openP;
                volumeBars.push({ time: candleTime, value: vol, color: priceIsUp ? '#089981' : '#f23645' });

                let currentOI = oiMap.get(candleTime) !== undefined ? oiMap.get(candleTime) : lastKnownOI;
                lastKnownOI = currentOI;
                
                const oiOpen = cachedOIData.length > 0 ? cachedOIData[cachedOIData.length - 1].close : currentOI;
                const oiClose = currentOI;
                const oiIsUp = oiClose >= oiOpen;

                const candleColor = getOICandleColor(priceIsUp, oiIsUp);

                cachedOIData.push({
                    time: candleTime,
                    open: oiOpen,
                    high: Math.max(oiOpen, oiClose),
                    low: Math.min(oiOpen, oiClose),
                    close: oiClose,
                    color: candleColor,
                    wickColor: candleColor === '#000000' ? '#555555' : candleColor,
                    borderColor: candleColor
                });

                let currentFunding = fundingMap.get(candleTime) !== undefined ? fundingMap.get(candleTime) : lastKnownFunding;
                lastKnownFunding = currentFunding;
                cachedFundingData.push({ time: candleTime, value: currentFunding });
            });

            priceSeries.setData(cachedPriceData);
            oiSeries.setData(cachedOIData);
            volumeSeries.setData(volumeBars);
            fundingSeries.setData(cachedFundingData);

            if (cachedPriceData.length > 12) {
                evaluateOrderFlowEngine(cachedPriceData.length - 1);
            }

            chart.timeScale().fitContent();
            connectWebSocket();

        } catch (err) {
            console.error("خطأ في جلب البيانات:", err);
        }
    }

    function connectWebSocket() {
        if (ws) ws.close();
        const streamSymbol = currentSymbol.toLowerCase();
        ws = new WebSocket(`wss://fstream.binance.com/ws/${streamSymbol}@kline_${currentInterval}`);

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.e === "kline") {
                const k = message.k;
                const candleTime = k.t / 1000;
                const openP = parseFloat(k.o), closeP = parseFloat(k.c);
                const vol = parseFloat(k.v);

                const priceIsUp = closeP >= openP;

                priceSeries.update({
                    time: candleTime, open: openP, high: parseFloat(k.h), low: parseFloat(k.l), close: closeP
                });

                volumeSeries.update({
                    time: candleTime, value: vol, color: priceIsUp ? '#089981' : '#f23645'
                });
            }
        };
    }

    function switchSymbol() {
        currentSymbol = document.getElementById('symbol').value;
        loadHistoricalData();
    }

    function changeInterval(tf) {
        currentInterval = tf;
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadHistoricalData();
    }

    window.onload = () => {
        populateSymbols();
        initChart();
        loadHistoricalData();
    };
</script>
</body>
</html>
