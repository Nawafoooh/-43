<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini - Coinalyze OI Navigator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #131314;
            color: #e3e3e3;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* شريط علوي بسيط بأسلوب جيميناي */
        .top-nav {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gemini-badge {
            font-size: 18px;
            font-weight: 600;
            background: linear-gradient(90deg, #4285f4, #9b51e0, #e91e63);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* الكارت المركزي */
        .central-card {
            background-color: #1e1f20;
            border: 1px solid #2f3032;
            border-radius: 24px;
            padding: 40px 32px;
            width: 100%;
            max-width: 580px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .card-header h1 {
            font-size: 24px;
            font-weight: 500;
            color: #f1f3f4;
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 14px;
            color: #9aa0a6;
        }

        /* القائمة المنسدلة المخصصة */
        .select-wrapper {
            width: 100%;
            position: relative;
        }

        select {
            width: 100%;
            background-color: #131314;
            color: #e3e3e3;
            border: 1px solid #444746;
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            transition: all 0.2s ease;
        }

        select:hover, select:focus {
            border-color: #a8c7fa;
            background-color: #1a1a1c;
        }

        .select-wrapper::after {
            content: '▼';
            font-size: 10px;
            color: #9aa0a6;
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* زر الفتح بأسلوب أزرار جوجل */
        .btn-launch {
            width: 100%;
            background: linear-gradient(135deg, #a8c7fa 0%, #7cacf8 100%);
            color: #040c1e;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-launch:hover {
            box-shadow: 0 4px 16px rgba(168, 199, 250, 0.25);
            transform: translateY(-1px);
        }

        .btn-launch:active {
            transform: translateY(0);
        }

        .footer-note {
            font-size: 12px;
            color: #72777d;
            margin-top: 8px;
        }
    </style>
</head>

        </button>

        <div class="footer-note">
            يتم التوجيه تلقائياً إلى صفحة /open-interest الخاصة بالعملة المحددة.

    function populateSelect() {
        const select = document.getElementById('coinalyzeSelect');

            const opt = document.createElement('option');
            opt.value = item.slug;
            opt.textContent = item.name;
            select.appendChild(opt);
        });
    }

    function openCoinalyzeLink() {
        const slug = document.getElementById('coinalyzeSelect').value;
        const url = `https://coinalyze.net/${slug}/open-interest/`;
