<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شارت السعر + Open Interest المتزامن</title>
    <!-- استدعاء مكتبة Lightweight Charts الرسمية من TradingView -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .chart-card {
            background-color: #1e222d;
            border-radius: 8px;
            padding: 15px;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        select, input {
            background-color: #2a2e39;
            color: #fff;
            border: 1px solid #434651;
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
        }
        .chart-header {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #787b86;
        }
        #price-container, #oi-container {
            width: 100%;
            position: relative;
        }
        #price-container { height: 350px; }
        #oi-container { height: 200px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="chart-card">
    <div class="controls">
        <label for="symbol">العملة:</label>
        <select id="symbol" onchange="loadChartData()">
            <option value="BTCUSDT">BTC/USDT</option>
            <option value="ETHUSDT">ETH/USDT</option>
            <option value="SOLUSDT">SOL/USDT</option>
        </select>

        <label for="interval">الفريم:</label>
        <select id="interval" onchange="loadChartData()">
            <option value="1h">1 ساعة</option>
            <option value="4h" selected>4 ساعات</option>
            <option value="1d">1 يوم</option>
        </select>
    </div>

    <!-- شارت السعر -->
    <div class="chart-header">حركة السعر (Price - Candles)</div>
    <div id="price-container"></div>

    <!-- شارت الـ Open Interest -->
    <div class="chart-header">مؤشر العقود المفتوحة (Open Interest - USD)</div>
    <div id="oi-container"></div>
</div>

<script>
    let priceChart, oiChart;
    let candlestickSeries, oiSeries;

    function initCharts() {
        const chartOptions = {
            layout: {
                backgroundColor: '#1e222d',
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2B2B43' },
                horzLines: { color: '#2B2B43' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
        };

        // إنشاء شارت السعر
        priceChart = LightweightCharts.createChart(document.getElementById('price-container'), {
            ...chartOptions,
            height: 350,
        });
        candlestickSeries = priceChart.addCandlestickSeries({
            upColor: '#26a69a', downColor: '#ef5350',
            borderVisible: false, wickUpColor: '#26a69a', wickDownColor: '#ef5350'
        });

        // إنشاء شارت الـ OI
        oiChart = LightweightCharts.createChart(document.getElementById('oi-container'), {
            ...chartOptions,
            height: 200,
        });
        oiSeries = oiChart.addAreaSeries({
            topColor: 'rgba(41, 98, 255, 0.4)',
            bottomColor: 'rgba(41, 98, 255, 0.0)',
            lineColor: '#2962ff',
            lineWidth: 2,
        });

        // === مزامنة حركة الشارتين (Time-Scale Syncing) ===
        priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
            oiChart.timeScale().setVisibleLogicalRange(range);
        });
        oiChart.timeScale().subscribeVisibleLogicalRangeChange(range => {
            priceChart.timeScale().setVisibleLogicalRange(range);
        });
    }

    async function loadChartData() {
        const symbol = document.getElementById('symbol').value;
        const interval = document.getElementById('interval').value;

        try {
            // 1. جلب بيانات الشموع (Klines) للسعر من Binance Futures
            const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=200`);
            const klineData = await klineRes.json();
            
            const formattedCandles = klineData.map(d => ({
                time: d[0] / 1000,
                open: parseFloat(d[1]),
                high: parseFloat(d[2]),
                low: parseFloat(d[3]),
                close: parseFloat(d[4])
            }));
            candlestickSeries.setData(formattedCandles);

            // 2. جلب بيانات الـ Open Interest التاريخية من Binance Futures API
            // تحويل الفريم لتنسيق يقبله هاندل الـ OI الخاص بـ Binance
            let period = interval;
            if (interval === '1d') period = '1d';
            
            const oiRes = await fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${symbol}&period=${period}&limit=200`);
            const oiData = await oiRes.json();

            const formattedOI = oiData.map(d => ({
                time: d.timestamp / 1000,
                value: parseFloat(d.sumOpenInterestValue) // القيمة الكلية للـ OI بالـ USD
            }));
            oiSeries.setData(formattedOI);

            // احتواء البيانات تلقائياً في العرض
            priceChart.timeScale().fitContent();
            oiChart.timeScale().fitContent();

        } catch (error) {
            console.error("خطأ في جلب البيانات:", error);
        }
    }

    // تهيئة الشارتات وإعادة التحميل عند فتح الصفحة
    window.onload = () => {
        initCharts();
        loadChartData();
    };
</script>

</body>
</html>
