<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مطابقة شمعة السعر مع شمعة الـ OI</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .chart-card {
            background-color: #1e222d;
            border-radius: 8px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        select {
            background-color: #2a2e39;
            color: #fff;
            border: 1px solid #434651;
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }
        .chart-header {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
            color: #787b86;
        }
        #price-container { height: 380px; }
        #oi-container { height: 250px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="chart-card">
    <div class="controls">
        <label for="symbol">اختر العملة:</label>
        <select id="symbol" onchange="loadChartData()"></select>

        <label for="interval">الفريم الزمني:</label>
        <select id="interval" onchange="loadChartData()">
            <option value="1h">1 ساعة</option>
            <option value="4h" selected>4 ساعات</option>
            <option value="1d">1 يوم</option>
        </select>
    </div>

    <!-- شارت السعر -->
    <div class="chart-header">حركة السعر (Price Candlesticks)</div>
    <div id="price-container"></div>

    <!-- شارت الـ OI المطابق تماماً -->
    <div class="chart-header">شموع الـ Open Interest (مطابقة زمنياً 1:1)</div>
    <div id="oi-container"></div>
</div>

<script>
    const top50Symbols = [
        "BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "SUIUSDT", "LINKUSDT",
        "NEARUSDT", "APTUSDT", "DOTUSDT", "LTCUSDT", "MATICUSDT", "SHIBUSDT", "PEPEUSDT", "FETUSDT", "ARBUSDT", "OPUSDT",
        "INJUSDT", "RNDRUSDT", "TIAUSDT", "SEIUSDT", "STXUSDT", "FILUSDT", "ATOMUSDT", "WIFUSDT", "FLOKIUSDT", "BONKUSDT",
        "TRXUSDT", "BCHUSDT", "ETCUSDT", "XLMUSDT", "ALGOUSDT", "AAVEUSDT", "UNIUSDT", "RENDERUSDT", "TAOUSDT", "ORDIUSDT",
        "SBDUSDT", "GMXUSDT", "DYDXUSDT", "FTMUSDT", "CRVUSDT", "LDOUSDT", "RUNEUSDT", "EGLDUSDT", "KASUSDT", "BLURUSDT"
    ];

    let priceChart, oiChart;
    let candlestickSeries, oiCandleSeries;

    function populateSymbols() {
        const select = document.getElementById('symbol');
        top50Symbols.forEach(sym => {
            const opt = document.createElement('option');
            opt.value = sym;
            opt.textContent = sym.replace('USDT', ' / USDT');
            select.appendChild(opt);
        });
    }

    function initCharts() {
        const chartOptions = {
            layout: { backgroundColor: '#1e222d', textColor: '#d1d4dc' },
            grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
            timeScale: { timeVisible: true, secondsVisible: false },
        };

        priceChart = LightweightCharts.createChart(document.getElementById('price-container'), { ...chartOptions, height: 380 });
        candlestickSeries = priceChart.addCandlestickSeries({
            upColor: '#089981', downColor: '#f23645',
            borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
        });

        oiChart = LightweightCharts.createChart(document.getElementById('oi-container'), { ...chartOptions, height: 250 });
        oiCandleSeries = oiChart.addCandlestickSeries({
            upColor: '#2962ff',       // صعود الـ OI
            downColor: '#ff6d00',     // هبوط الـ OI
            borderVisible: false, 
            wickUpColor: '#2962ff', 
            wickDownColor: '#ff6d00'
        });

        // ربط المحاور الزمنية بين الشارتين بإحكام
        priceChart.timeScale().subscribeVisibleLogicalRangeChange(range => oiChart.timeScale().setVisibleLogicalRange(range));
        oiChart.timeScale().subscribeVisibleLogicalRangeChange(range => priceChart.timeScale().setVisibleLogicalRange(range));
    }

    async function loadChartData() {
        const symbol = document.getElementById('symbol').value;
        const interval = document.getElementById('interval').value;

        try {
            // 1. جلب بيانات السعر
            const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=300`);
            const klineData = await klineRes.json();

            // 2. جلب بيانات الـ OI
            const oiRes = await fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${symbol}&period=${interval}&limit=500`);
            const oiData = await oiRes.json();

            // خريطة مفتاحها الوقت لتسريع البحث والمطابقة الدقيقة
            const oiMap = new Map();
            oiData.forEach(item => {
                // تقريب الوقت بالثواني الموحدة
                const timeKey = Math.floor(item.timestamp / 1000);
                oiMap.set(timeKey, parseFloat(item.sumOpenInterestValue));
            });

            const priceCandles = [];
            const oiCandles = [];
            
            let lastKnownOI = oiData.length > 0 ? parseFloat(oiData[0].sumOpenInterestValue) : 0;

            // 3. مطابقة البيانات شمعة بشمعة بنفس التوقيت (1:1 Syncing)
            klineData.forEach((d) => {
                const candleTime = d[0] / 1000;
                
                const openPrice = parseFloat(d[1]);
                const highPrice = parseFloat(d[2]);
                const lowPrice = parseFloat(d[3]);
                const closePrice = parseFloat(d[4]);

                priceCandles.push({
                    time: candleTime,
                    open: openPrice,
                    high: highPrice,
                    low: lowPrice,
                    close: closePrice
                });

                // البحث عن قيمة الـ OI المطابقة لهذا الوقت بالضبط
                let currentOI = oiMap.get(candleTime);
                
                // إذا لم توجد قراءة في تلك اللحظة بالضبط، نأخذ أقرب قيمة سابقة للحفاظ على تسلسل الشموع
                if (currentOI === undefined) {
                    currentOI = lastKnownOI;
                } else {
                    lastKnownOI = currentOI;
                }

                // فتح الشمعة = قيمة الـ OI السابقة، إغلاق الشمعة = القيمة الحالية
                const oiOpen = oiCandles.length > 0 ? oiCandles[oiCandles.length - 1].close : currentOI;
                const oiClose = currentOI;

                oiCandles.push({
                    time: candleTime, // إعطاء نفس الوقت بالضبط فشمعة السعر وشمعة الـ OI تتطابقان
                    open: oiOpen,
                    high: Math.max(oiOpen, oiClose),
                    low: Math.min(oiOpen, oiClose),
                    close: oiClose
                });
            });

            // تحديث الشارتات بالبيانات المنسقة والمطابقة
            candlestickSeries.setData(priceCandles);
            oiCandleSeries.setData(oiCandles);

            priceChart.timeScale().fitContent();
            oiChart.timeScale().fitContent();

        } catch (error) {
            console.error("خطأ في جلب أو مزامنة البيانات:", error);
        }
    }

    window.onload = () => {
        populateSymbols();
        initCharts();
        loadChartData();
    };
</script>

</body>
</html>
