<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة الاهتمام المفتوح الاحترافية — Crypto OI Monitor Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Lightweight Charts by TradingView -->
<script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg-0: #080b12;
  --bg-1: #0d111a;
  --bg-2: #111827;
  --border: #1e2735;
  --text-1: #e7ebf1;
  --text-2: #8b96a5;
  --text-3: #5b6576;
  --up: #22c55e;
  --down: #ef4444;
  --blue: #3b82f6;
  --blue-dim: rgba(59,130,246,0.15);
  --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg-0);
  color: var(--text-1);
  font-family: var(--sans);
  direction: rtl;
  min-height: 100vh;
}

header {
  height: 60px;
  background: var(--bg-1);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 36px; height: 36px; background: var(--blue);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: bold; color: #fff; box-shadow: 0 0 12px rgba(59,130,246,0.4);
}
.brand h1 { font-size: 16px; font-weight: 700; }

.stats-bar {
  display: flex; gap: 15px; font-size: 13px; color: var(--text-2);
}
.status-tag { display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 8px var(--up); }

main { padding: 20px; }
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
  gap: 20px;
}

.card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
}

.card-head {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.symbol-info { display: flex; align-items: center; gap: 8px; }
.symbol-name { font-size: 16px; font-weight: 700; }
.badge {
  font-size: 11px; padding: 2px 6px; border-radius: 4px;
  background: var(--blue-dim); color: var(--blue); font-weight: 600;
}

.oi-metrics {
  display: flex; gap: 12px; align-items: baseline;
}
.oi-val { font-size: 15px; font-weight: 700; font-family: monospace; }
.oi-change { font-size: 12px; font-weight: 600; }
.oi-change.up { color: var(--up); }
.oi-change.down { color: var(--down); }

.card-body {
  height: 260px;
  position: relative;
  background: var(--bg-1);
}

.card-foot {
  padding: 8px 16px;
  font-size: 11px;
  color: var(--text-3);
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
}

.loading {
  position: absolute; inset: 0; background: var(--bg-1);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-2); font-size: 13px; z-index: 10;
}

@media (max-width: 600px) {
  #grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">OI</div>
    <div>
      <h1>مراقب الاهتمام المفتوح المباشر</h1>
    </div>
  </div>
  <div class="stats-bar">
    <div class="status-tag"><span class="dot"></span> اتصال مباشر بـ Binance Futures API</div>
  </div>
</header>

<main>
  <div id="grid"></div>
</main>

<script>
// قائمة العملات المراد مراقبتها
const SYMBOLS = [
  { symbol: "BTCUSDT", name: "Bitcoin" },
  { symbol: "ETHUSDT", name: "Ethereum" },
  { symbol: "SOLUSDT", name: "Solana" },
  { symbol: "BNBUSDT", name: "BNB" },
  { symbol: "XRPUSDT", name: "XRP" },
  { symbol: "DOGEUSDT", name: "Dogecoin" }
];

const grid = document.getElementById("grid");

// تنسيق الأرقام الكبيرة (K, M, B)
function formatNumber(num) {
  if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
  if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
  if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
  return num.toFixed(2);
}

// إنشاء الكروت للعملات
function createCard(item) {
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <div class="card-head">
      <div class="symbol-info">
        <span class="symbol-name">${item.symbol.replace('USDT', '')}</span>
        <span class="badge">PERP</span>
      </div>
      <div class="oi-metrics">
        <span class="oi-val" id="val-${item.symbol}">--</span>
        <span class="oi-change" id="change-${item.symbol}">--</span>
      </div>
    </div>
    <div class="card-body" id="chart-${item.symbol}">
      <div class="loading" id="load-${item.symbol}"><i class="fa-solid fa-spinner fa-spin"></i> &nbsp; جلب بيانات الـ OI...</div>
    </div>
    <div class="card-foot">
      <span>مؤشر OI (Open Interest) الحقيقي</span>
      <span>الإطار: 5 دقائق</span>
    </div>
  `;
  grid.appendChild(card);
}

// رسم ومزامنة الشارت باستخدام Lightweight Charts
async function initChart(item) {
  const container = document.getElementById(`chart-${item.symbol}`);
  const loading = document.getElementById(`load-${item.symbol}`);
  const valEl = document.getElementById(`val-${item.symbol}`);
  const changeEl = document.getElementById(`change-${item.symbol}`);

  try {
    // 1. جلب تاريخ الـ Open Interest لآخر 30 نقطة (إطار 5m) من Binance
    const res = await fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${item.symbol}&period=5m&limit=35`);
    const data = await res.json();

    if (!data || data.length === 0) throw new Error("No data");

    loading.style.display = "none";

    // 2. إعداد الرسم البياني
    const chart = LightweightCharts.createChart(container, {
      layout: { backgroundColor: '#0d111a', textColor: '#8b96a5' },
      grid: {
        vertLines: { color: '#161f2c' },
        horzLines: { color: '#161f2c' }
      },
      timeScale: { timeVisible: true, secondsVisible: false },
      rightPriceScale: { borderVisible: false },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal }
    });

    const areaSeries = chart.addAreaSeries({
      topColor: 'rgba(59, 130, 246, 0.4)',
      bottomColor: 'rgba(59, 130, 246, 0.0)',
      lineColor: '#3b82f6',
      lineWidth: 2,
    });

    // 3. تجهيز البيانات للرسم
    const chartData = data.map(d => ({
      time: Math.floor(d.timestamp / 1000),
      value: parseFloat(d.sumOpenInterestValue) // القيمة بالدولار
    }));

    areaSeries.setData(chartData);
    chart.timeScale().fitContent();

    // 4. تحديث الأرقام والنسب المئوية في الهيدر
    const latest = chartData[chartData.length - 1].value;
    const previous = chartData[0].value;
    const diffPct = ((latest - previous) / previous) * 100;

    valEl.textContent = '$' + formatNumber(latest);
    changeEl.textContent = (diffPct >= 0 ? '+' : '') + diffPct.toFixed(2) + '%';
    changeEl.className = 'oi-change ' + (diffPct >= 0 ? 'up' : 'down');

  } catch (err) {
    loading.innerHTML = `<span style="color:var(--down)">تعذر جلب البيانات</span>`;
  }
}

// التشغيل الرئيسي
SYMBOLS.forEach(item => {
  createCard(item);
  initChart(item);
});
</script>
</body>
</html>
