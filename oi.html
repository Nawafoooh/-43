<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شارت موحد - تلوين شموع الـ OI حسب التغير</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .chart-card {
            background-color: #1e222d;
            border-radius: 8px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            align-items: center;
        }
        select {
            background-color: #2a2e39;
            color: #fff;
            border: 1px solid #434651;
            padding: 8px 12px;
            border-radius: 4px;
            outline: none;
            font-size: 14px;
        }
        .chart-header {
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
            color: #787b86;
            display: flex;
            justify-content: space-between;
        }
        #single-chart-container { 
            width: 100%; 
            height: 600px; 
            position: relative;
        }
    </style>
</head>
<body>

<div class="chart-card">
    <div class="controls">
        <label for="symbol">اختر العملة:</label>
        <select id="symbol" onchange="loadChartData()"></select>

        <label for="interval">الفريم الزمني:</label>
        <select id="interval" onchange="loadChartData()">
            <option value="1h">1 ساعة</option>
            <option value="4h" selected>4 ساعات</option>
            <option value="1d">1 يوم</option>
        </select>
    </div>

    <div class="chart-header">
        <span>Unified Chart (Price + Conditional Colored OI Candles)</span>
    </div>

    <div id="single-chart-container"></div>
</div>

<script>
    const top50Symbols = [
        "BTCUSDT", "ETHUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "SUIUSDT", "LINKUSDT",
        "NEARUSDT", "APTUSDT", "DOTUSDT", "LTCUSDT", "MATICUSDT", "SHIBUSDT", "PEPEUSDT", "FETUSDT", "ARBUSDT", "OPUSDT",
        "INJUSDT", "RNDRUSDT", "TIAUSDT", "SEIUSDT", "STXUSDT", "FILUSDT", "ATOMUSDT", "WIFUSDT", "FLOKIUSDT", "BONKUSDT",
        "TRXUSDT", "BCHUSDT", "ETCUSDT", "XLMUSDT", "ALGOUSDT", "AAVEUSDT", "UNIUSDT", "RENDERUSDT", "TAOUSDT", "ORDIUSDT",
        "SBDUSDT", "GMXUSDT", "DYDXUSDT", "FTMUSDT", "CRVUSDT", "LDOUSDT", "RUNEUSDT", "EGLDUSDT", "KASUSDT", "BLURUSDT"
    ];

    let unifiedChart;
    let priceSeries;
    let oiSeries;

    function populateSymbols() {
        const select = document.getElementById('symbol');
        top50Symbols.forEach(sym => {
            const opt = document.createElement('option');
            opt.value = sym;
            opt.textContent = sym.replace('USDT', ' / USDT');
            select.appendChild(opt);
        });
    }

    function initChart() {
        const container = document.getElementById('single-chart-container');
        
        unifiedChart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: 600,
            layout: {
                backgroundColor: '#1e222d',
                textColor: '#d1d4dc',
            },
            grid: {
                vertLines: { color: '#2B2B43' },
                horzLines: { color: '#2B2B43' },
            },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
            },
            leftPriceScale: { visible: true },
            rightPriceScale: { visible: true }
        });

        // شارت السعر العلوي
        priceSeries = unifiedChart.addCandlestickSeries({
            priceScaleId: 'right',
            upColor: '#089981', 
            downColor: '#f23645',
            borderVisible: false, 
            wickUpColor: '#089981', 
            wickDownColor: '#f23645'
        });

        // شارت الـ OI السفلي (يدعم تلوين كل شمعة بشكل فردي حسب حالتها)
        oiSeries = unifiedChart.addCandlestickSeries({
            priceScaleId: 'left',
            borderVisible: false,
        });

        unifiedChart.priceScale('right').applyOptions({
            scaleMargins: { top: 0.05, bottom: 0.35 },
        });

        unifiedChart.priceScale('left').applyOptions({
            scaleMargins: { top: 0.70, bottom: 0.02 },
        });

        window.addEventListener('resize', () => {
            unifiedChart.applyOptions({ width: container.clientWidth });
        });
    }

    async function loadChartData() {
        const symbol = document.getElementById('symbol').value;
        const interval = document.getElementById('interval').value;

        try {
            const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${symbol}&interval=${interval}&limit=300`);
            const klineData = await klineRes.json();

            const oiRes = await fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${symbol}&period=${interval}&limit=500`);
            const oiData = await oiRes.json();

            const oiMap = new Map();
            oiData.forEach(item => {
                const timeKey = Math.floor(item.timestamp / 1000);
                oiMap.set(timeKey, parseFloat(item.sumOpenInterestValue));
            });

            const priceCandles = [];
            const oiCandles = [];
            let lastKnownOI = oiData.length > 0 ? parseFloat(oiData[0].sumOpenInterestValue) : 0;

            klineData.forEach((d) => {
                const candleTime = d[0] / 1000;
                
                priceCandles.push({
                    time: candleTime,
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                });

                let currentOI = oiMap.get(candleTime);
                if (currentOI === undefined) {
                    currentOI = lastKnownOI;
                } else {
                    lastKnownOI = currentOI;
                }

                const oiOpen = oiCandles.length > 0 ? oiCandles[oiCandles.length - 1].close : currentOI;
                const oiClose = currentOI;

                // التحقق الشرطي لتغيير لون شمعة الـ OI بناءً على اتجاه تراكم/تفريغ السيولة
                // إذا ارتفع الـ OI (صعود السيولة) تكون زرقاء، وإذا انخفض (أو هبطت الشمعة وارتفع OI) يتم تلوينها بالأسود المميز
                let candleColor = '#2962ff'; // لون الافتراضي للصعود (أزرق)
                let wickColor = '#2962ff';

                if (oiClose < oiOpen) {
                    // انخفاض الـ OI (تفريغ سيولة)
                    candleColor = '#ff6d00'; 
                    wickColor = '#ff6d00';
                } else if (oiClose > oiOpen && oiClose < (oiOpen * 1.0005)) {
                    // تذبذب طفيف
                    candleColor = '#787b86';
                    wickColor = '#787b86';
                }

                // شرطك الأساسي: إذا هبط السعر (أو حدث العكس) ترافق مع ارتفاع OI، نلونها بالأسود أو حسب رغبتك
                const priceClosedLower = parseFloat(d[4]) < parseFloat(d[1]);
                const oiIncreased = oiClose >= oiOpen;

                if (priceClosedLower && oiIncreased) {
                    // شمعة سعر هابطة + OI مرتفع (تراكم عقود بيعية/شورت قوية) -> تلوين الشمعة بالأسود الداكن المميز
                    candleColor = '#000000';
                    wickColor = '#333333';
                }

                oiCandles.push({
                    time: candleTime,
                    open: oiOpen,
                    high: Math.max(oiOpen, oiClose),
                    low: Math.min(oiOpen, oiClose),
                    close: oiClose,
                    color: candleColor,
                    wickColor: wickColor,
                    borderColor: candleColor
                });
            });

            priceSeries.setData(priceCandles);
            oiSeries.setData(oiCandles);

            unifiedChart.timeScale().fitContent();

        } catch (error) {
            console.error("خطأ في تحميل البيانات:", error);
        }
    }

    window.onload = () => {
        populateSymbols();
        initChart();
        loadChartData();
    };
</script>

</body>
</html>
