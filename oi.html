<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Pro - Multi-Bar Cumulative AI Engine</title>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #131722;
            color: #d1d4dc;
            font-family: -apple-system, BlinkMacSystemFont, 'Trebuchet MS', Roboto, Ubuntu, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .tv-header {
            height: 50px;
            background-color: #1e222d;
            border-bottom: 1px solid #2a2e39;
            display: flex;
            align-items: center;
            padding: 0 16px;
            gap: 20px;
        }
        select {
            background-color: #2a2e39;
            color: #f0f3fa;
            border: 1px solid #434651;
            padding: 6px 12px;
            border-radius: 4px;
            outline: none;
            font-weight: 600;
            cursor: pointer;
        }
        select:hover { border-color: #2962ff; }

        .timeframe-group {
            display: flex;
            gap: 4px;
            background-color: #2a2e39;
            padding: 3px;
            border-radius: 4px;
        }
        .tf-btn {
            background: none;
            border: none;
            color: #787b86;
            padding: 4px 8px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 3px;
            cursor: pointer;
        }
        .tf-btn.active, .tf-btn:hover { background-color: #363a45; color: #f0f3fa; }
        .tf-btn.active { color: #2962ff; }

        /* شريط مساعد التحليل الذكي المطور التراكمي */
        .market-assistant {
            background: linear-gradient(90deg, #181b25 0%, #222735 100%);
            border-bottom: 1px solid #2a2e39;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }
        .assistant-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            color: #f0f3fa;
        }
        .assistant-badge {
            background: linear-gradient(135deg, #2962ff 0%, #1e88e5 100%);
            color: #fff;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(41, 98, 255, 0.4);
        }
        .assistant-msg {
            color: #d1d4dc;
            font-weight: 500;
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .highlight-bull { color: #089981; font-weight: bold; text-shadow: 0 0 8px rgba(8, 153, 129, 0.3); }
        .highlight-bear { color: #f23645; font-weight: bold; text-shadow: 0 0 8px rgba(242, 54, 69, 0.3); }
        .highlight-warn { color: #ffa726; font-weight: bold; }
        .highlight-purple { color: #bb86fc; font-weight: bold; }

        .live-status {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-right: auto;
            font-size: 12px;
            font-weight: bold;
            color: #089981;
        }
        .live-dot {
            width: 8px; height: 8px;
            background-color: #089981;
            border-radius: 50%;
            box-shadow: 0 0 8px #089981;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; }
        }

        .main-container { flex: 1; position: relative; width: 100%; }
        #chart-container { width: 100%; height: 100%; }

        .chart-legend {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 10;
            font-size: 12px;
            color: #b2b5be;
            background: rgba(19, 23, 34, 0.85);
            padding: 6px 12px;
            border-radius: 4px;
            backdrop-filter: blur(4px);
            border: 1px solid #2a2e39;
            pointer-events: none;
            display: flex;
            gap: 16px;
        }
        .legend-item { display: flex; gap: 4px; align-items: center; }
        .legend-title { font-weight: 600; color: #787b86; }
        .legend-value { font-weight: bold; }
        .up { color: #089981; }
        .down { color: #f23645; }
    </style>
</head>
<body>

    <div class="tv-header">
        <div class="symbol-selector">
            <select id="symbol" onchange="switchSymbol()"></select>
        </div>

        <div class="timeframe-group">
            <button class="tf-btn" onclick="changeInterval('1h')">1H</button>
            <button class="tf-btn active" onclick="changeInterval('4h')">4H</button>
            <button class="tf-btn" onclick="changeInterval('1d')">1D</button>
        </div>

        <div class="live-status">
            <div class="live-dot"></div>
            <span>LIVE BINANCE FUTURES</span>
        </div>
    </div>

    <!-- مساعد التحليل الذكي التراكمي (3 Bars Window Engine) -->
    <div class="market-assistant" id="marketAssistant">
        <div class="assistant-title">
            <span class="assistant-badge">SMART ENGINE [3-BARS]</span>
            <span>محلل التدفق والسيولة:</span>
        </div>
        <div class="assistant-msg" id="assistantText">
            جاري معالجة السلوك التراكمي عبر آخر 3 بارات متتالية...
        </div>
    </div>

    <div class="main-container">
        <div class="chart-legend" id="legend">
            <div class="legend-item"><span class="legend-title">Price:</span> <span id="price-val" class="legend-value">-</span></div>
            <div class="legend-item"><span class="legend-title">OI:</span> <span id="oi-val" class="legend-value">-</span></div>
            <div class="legend-item"><span class="legend-title">Vol:</span> <span id="vol-val" class="legend-value">-</span></div>
            <div class="legend-item"><span class="legend-title">Funding:</span> <span id="funding-val" class="legend-value">-</span></div>
        </div>
        <div id="chart-container"></div>
    </div>

<script>
    const top50Symbols = [
        "ETHUSDT", "BTCUSDT", "SOLUSDT", "BNBUSDT", "XRPUSDT", "DOGEUSDT", "ADAUSDT", "AVAXUSDT", "SUIUSDT", "LINKUSDT",
        "NEARUSDT", "APTUSDT", "DOTUSDT", "LTCUSDT", "MATICUSDT", "SHIBUSDT", "PEPEUSDT", "FETUSDT", "ARBUSDT", "OPUSDT",
        "INJUSDT", "RNDRUSDT", "TIAUSDT", "SEIUSDT", "STXUSDT", "FILUSDT", "ATOMUSDT", "WIFUSDT", "FLOKIUSDT", "BONKUSDT",
        "TRXUSDT", "BCHUSDT", "ETCUSDT", "XLMUSDT", "ALGOUSDT", "AAVEUSDT", "UNIUSDT", "RENDERUSDT", "TAOUSDT", "ORDIUSDT",
        "SBDUSDT", "GMXUSDT", "DYDXUSDT", "FTMUSDT", "CRVUSDT", "LDOUSDT", "RUNEUSDT", "EGLDUSDT", "KASUSDT", "BLURUSDT"
    ];

    let currentSymbol = "ETHUSDT";
    let currentInterval = "4h";
    
    let chart;
    let priceSeries, oiSeries, volumeSeries, fundingSeries;
    let ws;
    let cachedPriceData = [], cachedOIData = [], cachedFundingData = [];

    function populateSymbols() {
        const select = document.getElementById('symbol');
        select.innerHTML = '';
        top50Symbols.forEach(sym => {
            const opt = document.createElement('option');
            opt.value = sym;
            opt.textContent = sym.replace('USDT', ' / USDT');
            select.appendChild(opt);
        });
    }

    function formatNumber(val) {
        if (val >= 1000000) return (val / 1000000).toFixed(3) + 'M';
        if (val >= 1000) return (val / 1000).toFixed(2) + 'K';
        return val.toFixed(2);
    }

    function getOICandleColor(priceIsUp, oiIsUp) {
        if (priceIsUp && oiIsUp) return '#089981';       // صعود صريح
        if (!priceIsUp && !oiIsUp) return '#f23645';     // هبوط وتفريغ
        if (!priceIsUp && oiIsUp) return '#000000';      // هبوط السعر + صعود الـ OI (أسود / تجميع بيعي أو امتصاص)
        if (priceIsUp && !oiIsUp) return '#2962ff';      // صعود السعر + هبوط الـ OI (أزرق / تغطية شورتات)
        return '#787b86';
    }

    // 🔥 المحرك التراكمي المتقدم: تحليل سلوك 3 بارات متتالية + التمويل
    function evaluateMultiBarDynamics(targetIndex) {
        const assistantEl = document.getElementById('assistantText');
        if (!cachedPriceData || cachedPriceData.length < 4 || targetIndex < 3) return;

        // استخراج آخر 3 بارات من النقطة المحددة
        const pSlice = cachedPriceData.slice(targetIndex - 2, targetIndex + 1);
        const oiSlice = cachedOIData.slice(targetIndex - 2, targetIndex + 1);
        const currentFunding = cachedFundingData[targetIndex] ? cachedFundingData[targetIndex].value : 0;

        // 1. حساب المحصلة التراكمية للتغير في السعر والـ OI عبر الـ 3 بارات
        const priceNetChange = pSlice[2].close - pSlice[0].open;
        const priceNetPercent = (priceNetChange / pSlice[0].open) * 100;
        
        const oiNetChange = oiSlice[2].close - oiSlice[0].open;
        const oiNetPercent = (oiNetChange / oiSlice[0].open) * 100;

        // حساب عدد البارات الهابطة والصاعدة بشكل منفصل
        let priceDownBars = 0, priceUpBars = 0;
        let oiUpBars = 0, oiDownBars = 0;

        for (let i = 0; i < 3; i++) {
            if (pSlice[i].close >= pSlice[i].open) priceUpBars++; else priceDownBars++;
            if (oiSlice[i].close >= oiSlice[i].open) oiUpBars++; else oiDownBars++;
        }

        let statusHtml = "";
        let fundingNote = "";

        if (currentFunding > 0.0003) {
            fundingNote = ` | <span class="highlight-warn">⚠️ التمويل إيجابي مرتفع (${(currentFunding*100).toFixed(4)}%)</span>`;
        } else if (currentFunding < -0.0001) {
            fundingNote = ` | <span class="highlight-purple">⚡ التمويل سلبي (${(currentFunding*100).toFixed(4)}%) - ضغط شورتات مكثف</span>`;
        } else {
            fundingNote = ` | <span>التمويل متوازن (${(currentFunding*100).toFixed(4)}%)</span>`;
        }

        // --- السيناريوهات المركبة عالية الدقة ---

        // السيناريو الأول: امتصاص واستعداد لانعكاس صعودي قادم (Bullish Reversal / Short Squeeze)
        if (priceDownBars >= 2 && oiUpBars >= 2 && oiNetPercent > 0.5) {
            if (currentFunding < 0) {
                statusHtml = `<span class="highlight-bull">🚀 إشارة الشورت سكويز (Short Squeeze Alert):</span> السعر يضغط لأسفل لـ 3 بارات بينما الـ OI يرتفع بقوة (+${oiNetPercent.toFixed(2)}%) مع تمويل سلبي. <b style="color:#089981">انعكاس صعودي حاد متوقع قريباً!</b> ${fundingNote}`;
            } else {
                statusHtml = `<span class="highlight-bull">💎 امتصاص بيعي وتجميع خفي (Absorption):</span> هبوط السعر لـ 3 بارات يقابله ارتفاع تراكمي في الـ OI. صناع السوق يبتلعون البيع. <b style="color:#089981">توقع ارتداد لأعلى.</b> ${fundingNote}`;
            }
        }
        // السيناريو الثاني: توافق صعودي قوي واستمرار للاتجاه (Strong Bullish Continuation)
        else if (priceUpBars >= 2 && oiUpBars >= 2 && priceNetPercent > 0) {
            statusHtml = `<span class="highlight-bull">🟢 اتجاه صاعد صحي ومستمر (Long Accumulation):</span> توافق صعودي عبر آخر 3 بارات (السعر +${priceNetPercent.toFixed(2)}% | الـ OI +${oiNetPercent.toFixed(2)}%). السيولة حقيقية وتدعم صعوداً أطول. ${fundingNote}`;
        }
        // السيناريو الثالث: صعود وهمي ونفاد السيولة (Bull Trap / Short Covering)
        else if (priceUpBars >= 2 && oiDownBars >= 2 && oiNetPercent < -0.5) {
            statusHtml = `<span class="highlight-warn">⚠️ تحذير: صعود كاذب (Bull Trap / Long Unwinding):</span> السعر يرتفع لـ 3 بارات بينما الـ OI ينخفض بـ (${oiNetPercent.toFixed(2)}%). الصعود بدون سيولة حقيقية. <b style="color:#ffa726">انتبه من هبوط مفاجئ!</b> ${fundingNote}`;
        }
        // السيناريو الرابع: هبوط متسارع مع ضغط شورتات جديد (Aggressive Short Building)
        else if (priceDownBars >= 2 && priceNetPercent < -0.8 && oiUpBars >= 2) {
            statusHtml = `<span class="highlight-bear">🔴 هبوط قوي ودخول بائعين جدد (Aggressive Selling):</span> انخفاض السعر لـ 3 بارات بـ (${priceNetPercent.toFixed(2)}%) مترافق مع فتح عقود شورت جديدة. ${fundingNote}`;
        }
        // السيناريو الخامس: تصفية المراكز والهبوط الخفيف (Long Liquidation)
        else if (priceDownBars >= 2 && oiDownBars >= 2) {
            statusHtml = `<span class="highlight-bear">🔻 خروج مراكز واستراحة مؤقتة (Long Liquidation):</span> هبوط السعر مع انخفاض الـ OI كالمعتاد. السوق يتخلص من الرافعات المالية العالية. ${fundingNote}`;
        }
        // متوازن / غير محدد
        else {
            statusHtml = `<span>🔄 سلوك متذبذب (3-Bars):</span> تغير السعر (${priceNetPercent.toFixed(2)}%) | تغير الـ OI (${oiNetPercent.toFixed(2)}%). لا توجد هيمنة واضحة حالياً. ${fundingNote}`;
        }

        assistantEl.innerHTML = statusHtml;
    }

    function initChart() {
        const container = document.getElementById('chart-container');
        
        chart = LightweightCharts.createChart(container, {
            width: container.clientWidth,
            height: container.clientHeight,
            layout: { backgroundColor: '#131722', textColor: '#787b86', fontSize: 11 },
            grid: {
                vertLines: { color: 'rgba(42, 46, 57, 0.3)' },
                horzLines: { color: 'rgba(42, 46, 57, 0.3)' }
            },
            crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
            timeScale: {
                timeVisible: true,
                secondsVisible: false,
                borderColor: '#2a2e39',
                tickMarkFormatter: (time) => {
                    const date = new Date(time * 1000);
                    const hours = date.getHours().toString().padStart(2, '0');
                    const minutes = date.getMinutes().toString().padStart(2, '0');
                    const month = (date.getMonth() + 1).toString().padStart(2, '0');
                    const day = date.getDate().toString().padStart(2, '0');
                    return currentInterval === '1d' ? `${month}/${day}` : `${month}/${day} ${hours}:${minutes}`;
                }
            },
            rightPriceScale: { visible: true, borderColor: '#2a2e39' }
        });

        priceSeries = chart.addCandlestickSeries({
            priceScaleId: 'right',
            upColor: '#089981', downColor: '#f23645',
            borderVisible: false, wickUpColor: '#089981', wickDownColor: '#f23645'
        });

        oiSeries = chart.addCandlestickSeries({
            priceScaleId: 'oiScale',
            borderVisible: false,
            priceFormat: { type: 'custom', formatter: price => formatNumber(price) },
        });

        volumeSeries = chart.addHistogramSeries({
            priceScaleId: 'volScale',
            priceFormat: { type: 'volume' }
        });

        fundingSeries = chart.addBaselineSeries({
            priceScaleId: 'fundingScale',
            baseValue: { type: 'price', price: 0 },
            topLineColor: '#089981', topFillColor1: 'rgba(8, 153, 129, 0.2)', topFillColor2: 'rgba(8, 153, 129, 0.0)',
            bottomLineColor: '#f23645', bottomFillColor1: 'rgba(242, 54, 69, 0.0)', bottomFillColor2: 'rgba(242, 54, 69, 0.2)',
            lineWidth: 2
        });

        chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.02, bottom: 0.52 } });
        chart.priceScale('oiScale').applyOptions({ scaleMargins: { top: 0.52, bottom: 0.32 }, autoScale: true });
        chart.priceScale('volScale').applyOptions({ scaleMargins: { top: 0.70, bottom: 0.16 } });
        chart.priceScale('fundingScale').applyOptions({ scaleMargins: { top: 0.86, bottom: 0.02 } });

        window.addEventListener('resize', () => {
            chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
        });

        // قراءة الماوس اللحظية وتطبيق المحرك التراكمي على النقطة المحددة
        chart.subscribeCrosshairMove(param => {
            if (param.time) {
                const pData = param.seriesData.get(priceSeries);
                const oiData = param.seriesData.get(oiSeries);
                const vData = param.seriesData.get(volumeSeries);
                const fData = param.seriesData.get(fundingSeries);

                if (pData) {
                    document.getElementById('price-val').innerText = pData.close.toFixed(2);
                    document.getElementById('price-val').className = `legend-value ${pData.close >= pData.open ? 'up' : 'down'}`;
                }
                if (oiData) {
                    document.getElementById('oi-val').innerText = formatNumber(oiData.close);
                }
                if (vData) {
                    document.getElementById('vol-val').innerText = formatNumber(vData.value);
                    document.getElementById('vol-val').className = `legend-value ${vData.color === '#089981' ? 'up' : 'down'}`;
                }
                if (fData) {
                    document.getElementById('funding-val').innerText = (fData.value * 100).toFixed(4) + '%';
                    document.getElementById('funding-val').className = `legend-value ${fData.value >= 0 ? 'up' : 'down'}`;
                }

                // العثور على الفهرس الزمني وتحليل آخر 3 بارات عنده
                const hoverIdx = cachedPriceData.findIndex(item => item.time === param.time);
                if (hoverIdx !== -1) {
                    evaluateMultiBarDynamics(hoverIdx);
                }
            }
        });
    }

    async function loadHistoricalData() {
        try {
            const klineRes = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=${currentSymbol}&interval=${currentInterval}&limit=300`);
            const klineData = await klineRes.json();

            const oiRes = await fetch(`https://fapi.binance.com/futures/data/openInterestHist?symbol=${currentSymbol}&period=${currentInterval}&limit=500`);
            const oiData = await oiRes.json();

            const fundingRes = await fetch(`https://fapi.binance.com/fapi/v1/fundingRate?symbol=${currentSymbol}&limit=500`);
            const fundingData = await fundingRes.json();

            const oiMap = new Map();
            oiData.forEach(item => oiMap.set(Math.floor(item.timestamp / 1000), parseFloat(item.sumOpenInterest)));

            const fundingMap = new Map();
            fundingData.forEach(item => fundingMap.set(Math.floor(item.fundingTime / 1000), parseFloat(item.fundingRate)));

            cachedPriceData = [];
            cachedOIData = [];
            cachedFundingData = [];
            const volumeBars = [];

            let lastKnownOI = oiData.length > 0 ? parseFloat(oiData[0].sumOpenInterest) : 0;
            let lastKnownFunding = fundingData.length > 0 ? parseFloat(fundingData[0].fundingRate) : 0;

            klineData.forEach((d) => {
                const candleTime = d[0] / 1000;
                const openP = parseFloat(d[1]), highP = parseFloat(d[2]), lowP = parseFloat(d[3]), closeP = parseFloat(d[4]);
                const vol = parseFloat(d[5]);

                cachedPriceData.push({ time: candleTime, open: openP, high: highP, low: lowP, close: closeP });

                const priceIsUp = closeP >= openP;
                volumeBars.push({ time: candleTime, value: vol, color: priceIsUp ? '#089981' : '#f23645' });

                let currentOI = oiMap.get(candleTime) !== undefined ? oiMap.get(candleTime) : lastKnownOI;
                lastKnownOI = currentOI;
                
                const oiOpen = cachedOIData.length > 0 ? cachedOIData[cachedOIData.length - 1].close : currentOI;
                const oiClose = currentOI;
                const oiIsUp = oiClose >= oiOpen;

                const candleColor = getOICandleColor(priceIsUp, oiIsUp);

                cachedOIData.push({
                    time: candleTime,
                    open: oiOpen,
                    high: Math.max(oiOpen, oiClose),
                    low: Math.min(oiOpen, oiClose),
                    close: oiClose,
                    color: candleColor,
                    wickColor: candleColor === '#000000' ? '#555555' : candleColor,
                    borderColor: candleColor
                });

                let currentFunding = fundingMap.get(candleTime) !== undefined ? fundingMap.get(candleTime) : lastKnownFunding;
                lastKnownFunding = currentFunding;
                cachedFundingData.push({ time: candleTime, value: currentFunding });
            });

            priceSeries.setData(cachedPriceData);
            oiSeries.setData(cachedOIData);
            volumeSeries.setData(volumeBars);
            fundingSeries.setData(cachedFundingData);

            // تشغيل المحرك التراكمي فوراً على أحدث بار بعد التحميل
            if (cachedPriceData.length > 3) {
                evaluateMultiBarDynamics(cachedPriceData.length - 1);
            }

            chart.timeScale().fitContent();
            connectWebSocket();

        } catch (err) {
            console.error("خطأ في جلب البيانات:", err);
        }
    }

    function connectWebSocket() {
        if (ws) ws.close();
        const streamSymbol = currentSymbol.toLowerCase();
        ws = new WebSocket(`wss://fstream.binance.com/ws/${streamSymbol}@kline_${currentInterval}`);

        ws.onmessage = (event) => {
            const message = JSON.parse(event.data);
            if (message.e === "kline") {
                const k = message.k;
                const candleTime = k.t / 1000;
                const openP = parseFloat(k.o), closeP = parseFloat(k.c);
                const vol = parseFloat(k.v);

                const priceIsUp = closeP >= openP;

                priceSeries.update({
                    time: candleTime, open: openP, high: parseFloat(k.h), low: parseFloat(k.l), close: closeP
                });

                volumeSeries.update({
                    time: candleTime, value: vol, color: priceIsUp ? '#089981' : '#f23645'
                });
            }
        };
    }

    function switchSymbol() {
        currentSymbol = document.getElementById('symbol').value;
        loadHistoricalData();
    }

    function changeInterval(tf) {
        currentInterval = tf;
        document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        loadHistoricalData();
    }

    window.onload = () => {
        populateSymbols();
        initChart();
        loadHistoricalData();
    };
</script>
</body>
</html>
