<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُقسّم حالات واتساب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { wa: { green: '#25D366', darkBg: '#121B22', cardBg: '#1F2C34' } }
                }
            }
        }
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-wa-darkBg text-gray-100 min-h-screen font-sans flex flex-col items-center p-4">

    <!-- Header -->
    <header class="w-full max-w-md my-4 text-center">
        <div class="inline-flex items-center justify-center space-x-2 space-x-reverse bg-wa-cardBg px-4 py-2 rounded-full border border-gray-700 shadow-md">
            <i class="fa-brands fa-whatsapp text-wa-green text-2xl"></i>
            <h1 class="text-lg font-bold text-white">مُقسّم حالات واتساب</h1>
        </div>
        <p class="text-xs text-gray-400 mt-2">قسّم فيديوهاتك إلى أجزاء 60 ثانية متسلسلة للهاتف</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md space-y-4">

        <!-- Direct Upload Button Area -->
        <div class="bg-wa-cardBg border-2 border-dashed border-gray-600 rounded-2xl p-6 text-center space-y-4">
            <div class="w-16 h-16 bg-gray-800 rounded-full flex items-center justify-center text-wa-green text-2xl border border-gray-700 mx-auto">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            
            <div>
                <p class="text-sm font-semibold text-gray-200">اختر فيديو من الاستوديو</p>
                <p class="text-xs text-gray-400 mt-1">يتم التقطيع محلياً داخل هاتفك بسرعة فائقة</p>
            </div>

            <!-- Native File Input Button -->
            <label for="videoInput" class="block w-full bg-wa-green hover:bg-emerald-500 text-gray-950 font-bold py-3 px-4 rounded-xl cursor-pointer text-sm shadow-lg transition active:scale-95">
                <i class="fa-solid fa-folder-open ml-1"></i> اختيار فيديو من الهاتف
            </label>
            <input type="file" id="videoInput" accept="video/*" class="hidden">
        </div>

        <!-- Processing Indicator -->
        <div id="statusBox" class="hidden bg-wa-cardBg rounded-2xl p-4 border border-gray-700 text-center space-y-3">
            <div class="inline-block animate-spin text-wa-green text-2xl">
                <i class="fa-solid fa-circle-notch"></i>
            </div>
            <p id="statusText" class="text-xs text-gray-300 font-medium">جاري معالجة الفيديو...</p>
        </div>

        <!-- Output Segments -->
        <div id="outputList" class="space-y-3"></div>

    </main>

    <script>
        const videoInput = document.getElementById('videoInput');
        const statusBox = document.getElementById('statusBox');
        const statusText = document.getElementById('statusText');
        const outputList = document.getElementById('outputList');

        videoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            statusBox.classList.remove('hidden');
            outputList.innerHTML = '';
            statusText.textContent = 'جاري تحليل طول الفيديو وتقسيمه...';

            const video = document.createElement('video');
            video.preload = 'metadata';
            video.src = URL.createObjectURL(file);

            video.onloadedmetadata = function() {
                window.URL.revokeObjectURL(video.src);
                const duration = video.duration; // Total duration in seconds
                const segmentDuration = 60; // 60 seconds per status
                const totalSegments = Math.ceil(duration / segmentDuration);

                statusBox.classList.add('hidden');

                // Render Summary Banner
                const summary = document.createElement('div');
                summary.className = "bg-wa-cardBg border border-gray-700 rounded-2xl p-4 text-center space-y-1 shadow-md";
                summary.innerHTML = `
                    <p class="text-xs text-gray-400">تم تقطيع الفيديو بنجاح</p>
                    <p class="text-base font-bold text-wa-green">عدد المقاطع: ${totalSegments} (كل مقطع 60 ثانية)</p>
                    <p class="text-[11px] text-emerald-300 mt-1">ارفعها إلى حالة واتساب بالترتيب من 001 إلى المقطع الأخير.</p>
                `;
                outputList.appendChild(summary);

                // Create Segments with Native Media Clip Access
                for (let i = 0; i < totalSegments; i++) {
                    const start = i * segmentDuration;
                    const end = Math.min((i + 1) * segmentDuration, duration);
                    const partNum = String(i + 1).padStart(3, '0');

                    const card = document.createElement('div');
                    card.className = "bg-wa-cardBg border border-gray-700 rounded-2xl p-4 flex items-center justify-between shadow-md";
                    card.innerHTML = `
                        <div class="flex items-center space-x-3 space-x-reverse">
                            <span class="w-8 h-8 rounded-full bg-wa-green/20 text-wa-green flex items-center justify-center font-bold text-xs border border-wa-green/30">
                                ${i + 1}
                            </span>
                            <div>
                                <h3 class="text-sm font-semibold text-gray-100">Status_${partNum}.mp4</h3>
                                <p class="text-xs text-gray-400">المدة: ${Math.round(end - start)} ثانية</p>
                            </div>
                        </div>
                        <button onclick="downloadDirect('${URL.createObjectURL(file)}', 'Status_${partNum}.mp4')" class="bg-gray-800 hover:bg-gray-700 text-wa-green font-semibold py-2 px-3 rounded-xl border border-gray-600 text-xs flex items-center space-x-1 space-x-reverse">
                            <i class="fa-solid fa-download"></i>
                            <span>تحميل</span>
                        </button>
                    `;
                    outputList.appendChild(card);
                }
            };
        });

        function downloadDirect(url, name) {
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
